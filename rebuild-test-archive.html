<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Αρχείο Εξετάσεων — SeaService Calculator</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Anco-Solutions/KEP-AEN@rebuild/supabase-clean-frontend-v2/rebuild/styles.css?v=20260913-9"></head><body><main class="app"><header class="card app-header"><h1 style="text-align:center">SeaService Calculator</h1><div id="who" class="signed-in"></div><div id="navBox"></div></header><section class="card"><h2>Αρχείο Εξετάσεων</h2><input id="search" placeholder="Αναζήτηση Μητρώου ή Ονοματεπωνύμου"><div id="status" class="muted" style="margin:10px 0"></div><div id="list"></div></section><footer class="site-footer">© 2026 <span class="author">Tassos Ballas</span> · All rights reserved.</footer></main><script type="module">import{requireUser,supabase,nav,footer,wireLogout}from'https://cdn.jsdelivr.net/gh/Anco-Solutions/KEP-AEN@rebuild/supabase-clean-frontend-v2/rebuild/portal.js?v=1';const p=await requireUser();if(p){document.getElementById('who').textContent=`Συνδεδεμένος: ${p.full_name||p.email} (${p.role})`;document.getElementById('navBox').innerHTML=nav(p);wireLogout();let rows=[];async function load(){const s=document.getElementById('status');s.textContent='Φόρτωση…';const{data,error}=await supabase.from('examinations').select('id,registry_number,full_name,kep,rank,documents_status,examination_status,grade,grade_classification,final_decision,service_months,service_days,updated_at,examiner:examiner_id(full_name)').order('updated_at',{ascending:false}).limit(200);if(error){s.textContent='Σφάλμα: '+error.message;return}rows=data||[];render()}function render(){const q=document.getElementById('search').value.trim().toLowerCase();const x=rows.filter(r=>!q||r.registry_number.toLowerCase().includes(q)||r.full_name.toLowerCase().includes(q));document.getElementById('status').textContent=`${x.length} εγγραφές`;document.getElementById('list').innerHTML=x.map(r=>`<article class="card"><strong>${r.full_name}</strong><div>Μητρώο: ${r.registry_number} · ΚΕΠ ${r.kep}</div><div>Υπηρεσία: ${r.service_months} μήνες και ${r.service_days} ημέρες</div><div>Εξέταση: ${r.examination_status}${r.grade!=null?' · Βαθμός: '+r.grade:''}</div><div>${r.final_decision||'Σε εκκρεμότητα'}</div><div class="muted">Εξεταστής: ${r.examiner?.full_name||'—'} · ${new Date(r.updated_at).toLocaleString('el-GR')}</div></article>`).join('')||'<div class="muted">Δεν βρέθηκαν εγγραφές.</div>'}document.getElementById('search').addEventListener('input',render);load()}</script></body></html>
