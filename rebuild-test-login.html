<!doctype html>

<head>

<title>SeaService Calculator</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;justify-content:center}.app{width:min(100%,560px);padding:18px 14px 14px}
.login-card{background:#fff;border:1px solid #dfe5ed;border-radius:18px;padding:22px 20px 20px;box-shadow:0 8px 28px rgba(20,45,75,.08)}
h1{margin:0;text-align:center;color:#0b477f;font-size:25px;line-height:1.1;font-weight:800;letter-spacing:-.2px}.datetime{margin:8px 0 20px;text-align:center;font-size:13px;font-weight:700;color:#596579;white-space:nowrap}h2{margin:0 0 14px;text-align:center;color:#172033;font-size:19px;line-height:1.2;font-weight:800}.field{margin:0 0 11px}.field label{display:block;margin:0 0 4px;font-size:13px;font-weight:700;color:#364154}
input,select{display:block;width:100%;height:40px;min-height:40px;padding:7px 10px;border:1px solid #cbd3df;border-radius:9px;background:#fff;color:#172033;font-size:16px;outline:none}input:focus{border-color:#4775a7;box-shadow:0 0 0 2px rgba(71,117,167,.12)}
.btn{width:100%;height:40px;min-height:40px;border-radius:9px;border:0;padding:7px 12px;font-size:14px;font-weight:800;cursor:pointer}.btn-primary{background:#31598f;color:#fff}.btn-primary:disabled{opacity:.7;cursor:wait}.message{min-height:18px;margin-top:8px;text-align:center;font-size:12.5px;font-weight:700}.site-footer{margin-top:10px;text-align:center;font-size:10.5px;color:#8a94a3}.site-footer .author{font-weight:800;font-style:italic;color:#687384}.hidden{display:none!important}
.header,.card{background:#fff;border:1px solid #dfe5ed;border-radius:16px;padding:13px 14px;margin-bottom:8px;box-shadow:0 4px 18px rgba(20,45,75,.06)}.header h1{font-size:24px}.signed{margin:5px 0 8px;text-align:center;font-size:13px;font-weight:800;color:#364154}.actions{display:flex;gap:6px;flex-wrap:wrap}.action{height:36px;min-height:36px;padding:0 10px;border-radius:9px;border:1px solid #d5dbe3;background:#f7f9fb;color:#172033;font-size:12.5px;font-weight:800;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.1;flex:1}.archive{flex-basis:100%;background:#31598f;color:#fff;border-color:#31598f}#adminButton{display:none}
.kep-options{display:grid;grid-template-columns:1fr 1fr;gap:7px}.kep-option{display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;padding:0 12px!important;height:40px!important;border:1px solid #cbd3df;border-radius:9px;font-size:14px;font-weight:800;white-space:nowrap;line-height:1!important}.kep-option input{display:block!important;flex:0 0 17px!important;width:17px!important;height:17px!important;min-height:17px!important;margin:0!important;padding:0!important;transform:none!important;vertical-align:middle}.examiner{display:none;margin-top:7px}.examiner.active{display:block}.examiner label{display:block;font-size:13px;font-weight:800;margin-bottom:4px}.footer-action{text-align:center;margin:8px 0}.footer-action button{width:auto;padding:7px 14px}
</style>
</head>
<body><main class="app">
<section id="authCard" class="login-card"><h1>SeaService Calculator</h1><div id="authDateTime" class="datetime"></div><h2>Σύνδεση</h2><div class="field"><label for="loginEmail">Email</label><input id="loginEmail" type="email" autocomplete="username" autocapitalize="none" spellcheck="false"></div><div class="field"><label for="loginPassword">Κωδικός</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button id="loginButton" class="btn btn-primary" type="button">Σύνδεση</button><div id="authMessage" class="message"></div></section>
<section id="appShell" class="hidden"><header class="header"><h1>SeaService Calculator</h1><div id="calculationDateTime" class="datetime"></div><div id="signedInAs" class="signed"></div><div class="actions"><a class="action archive" href="rebuild-test-archive.html?v=5">📁 Αρχείο Εξέτασης ΚΕΠ →</a><a id="adminButton" class="action" href="rebuild-test-admin.html?v=5">⚙️ Διαχείριση</a><button id="logoutButton" class="action" type="button">Αποσύνδεση</button></div></header>
<section class="card"><div class="field"><label for="registry">Μητρώο εξεταζόμενου</label><input id="registry" inputmode="numeric"></div><div class="field"><label for="fullName">Ονοματεπώνυμο εξεταζόμενου</label><input id="fullName"></div><div class="field"><label>ΚΕΠ</label><div class="kep-options"><label class="kep-option"><input type="radio" name="kep" value="1"><span>ΚΕΠ 1</span></label><label class="kep-option"><input type="radio" name="kep" value="2"><span>ΚΕΠ 2</span></label></div><div id="examiner1Box" class="examiner"><label for="examiner1">Εξεταστής</label><select id="examiner1"><option value="">— Επιλέξτε εξεταστή —</option></select></div><div id="examiner2Box" class="examiner"><label for="examiner2">Εξεταστής</label><select id="examiner2"><option value="">— Επιλέξτε εξεταστή —</option></select></div></div></section><div class="footer-action"><button id="newEntry" class="action" type="button">＋ Νέα καταχώριση</button></div></section>
<footer class="site-footer">© 2026 <span class="author">Tassos Ballas</span> · All rights reserved.</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(function(){function clock(){var n=new Date(),s='Ημερομηνία & ώρα: '+n.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+n.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});document.querySelectorAll('.datetime').forEach(function(e){e.textContent=s})}clock();setInterval(clock,1000)})();
(function(){var client=supabase.createClient('https://yblvmtaxorbdctvrpqer.supabase.co','sb_publishable_g5YEf2H_2yWoDM1DOzKtQw_qsCvc6ty'),authCard=document.getElementById('authCard'),shell=document.getElementById('appShell'),msg=document.getElementById('authMessage'),login=document.getElementById('loginButton'),admin=document.getElementById('adminButton'),nameEl=document.getElementById('signedInAs'),busy=false;function showLogin(){authCard.classList.remove('hidden');shell.classList.add('hidden')}function showApp(){authCard.classList.add('hidden');shell.classList.remove('hidden')}async function enter(session){if(!session){showLogin();return}try{var r=await client.from('profiles').select('id,full_name,role,active').eq('id',session.user.id).single();if(r.error)throw r.error;if(!r.data.active)throw new Error('Ο λογαριασμός σας δεν είναι ενεργός.');if(r.data.role!=='admin'&&r.data.role!=='teacher')throw new Error('Ο λογαριασμός σας δεν έχει δικαίωμα πρόσβασης.');nameEl.textContent='Συνδεδεμένος: '+(r.data.full_name&&r.data.full_name.trim()?r.data.full_name:(r.data.role==='admin'?'Tassos Ballas':'Χρήστης'));admin.style.display=r.data.role==='admin'?'flex':'none';showApp()}catch(e){showLogin();msg.textContent=e.message||'Δεν επιτρέπεται η πρόσβαση.';msg.style.color='#b42318'}}login.addEventListener('click',async function(){if(busy)return;busy=true;login.disabled=true;msg.textContent='Γίνεται σύνδεση…';msg.style.color='#596579';try{var email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password)throw new Error('Συμπληρώστε email και κωδικό.');var r=await client.auth.signInWithPassword({email:email,password:password});if(r.error)throw r.error;document.getElementById('loginPassword').value='';await enter(r.data.session)}catch(e){msg.textContent='Αποτυχία σύνδεσης: '+(e.message||e);msg.style.color='#b42318'}finally{busy=false;login.disabled=false}});document.getElementById('loginPassword').addEventListener('keydown',function(e){if(e.key==='Enter')login.click()});document.getElementById('logoutButton').addEventListener('click',async function(){await client.auth.signOut();showLogin()});client.auth.onAuthStateChange(function(event,session){if(event==='SIGNED_OUT')showLogin();else if(event==='SIGNED_IN'&&session)enter(session)});client.auth.getSession().then(function(r){enter(r.data.session)}).catch(function(e){showLogin();msg.textContent='Αδυναμία ελέγχου σύνδεσης: '+e.message;msg.style.color='#b42318'})})();
</script></body></html>
