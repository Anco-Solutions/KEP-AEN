lass="card"><div class="field"><label for="registry">Μητρώο εξεταζόμενου</label><input id="registry" inputmode="numeric"></div><div class="field"><label for="fullName">Ονοματεπώνυμο εξεταζόμενου</label><input id="fullName"></div><div class="field"><label>ΚΕΠ</label><div class="kep-options"><label class="kep-option"><input type="radio" name="kep" value="1">ΚΕΠ 1</label><label class="kep-option"><input type="radio" name="kep" value="2">ΚΕΠ 2</label></div><div id="examiner1Box" class="examiner"><label for="examiner1">Εξεταστής</label><select id="examiner1"><option>— Επιλέξτε εξεταστή —</option></select></div><div id="examiner2Box" class="examiner"><label for="examiner2">Εξεταστής</label><select id="examiner2"><option>— Επιλέξτε εξεταστή —</option></select></div></div></section><section id="workArea" class="card hidden"><h2>Υπηρεσία</h2><div class="field"><label for="embark">Ημερομηνία Ναυτολόγησης</label><input id="embark" type="date"></div><div class="field"><label for="discharge">Ημερομηνία Απόλυσης</label><input id="discharge" type="date"></div><div class="field"><label for="rank">Βαθμός</label><select id="rank"><option>Δόκιμος Μηχανικός</option><option>Καθαριστής</option><option>Μηχανοδηγός / Λιπαντής</option></select></div><div class="actions"><button id="addTrip" class="btn btn-secondary">＋ Προσθήκη Ταξιδιού</button><button id="calculate" class="btn btn-primary">Υπολογισμός Υπηρεσίας</button></div><div id="tripList"></div><div id="serviceSummary" class="service-summary"></div><div id="result" class="result pending">Δεν έχει γίνει ακόμη υπολογισμός.</div><section id="examPanel" class="card exam-panel"><h2>Στοιχεία Εξέτασης ΚΕΠ</h2><div class="field"><label>Δικαιολογητικά</label><div class="radio-row"><label><input type="radio" name="docs">Δεν έχουν ελεγχθεί</label><label><input type="radio" name="docs">Πλήρη</label><label><input type="radio" name="docs">Ελλιπή</label></div></div><div class="field"><label>Εξέταση</label><div class="radio-row"><label><input type="radio" name="examState" checked>Εκκρεμεί</label><label><input type="radio" name="examState">Ολοκληρώθηκε</label></div></div><div id="gradeWrap" class="field grade-wrap"><label for="grade">Βαθμός εξέτασης (0–10)</label><input id="grade" type="number" min="0" max="10" step="0.01"></div><div id="decision">ΤΕΛΙΚΗ ΑΠΟΦΑΣΗ: Σε εκκρεμότητα</div></section></section><footer class="footer-actions"><button id="newEntry" class="btn btn-secondary">＋ Νέα καταχώριση</button></footer></section><footer class="site-footer">© 2026 <span class="author">Tassos Ballas</span> · All rights reserved.</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(function(){function clock(){var n=new Date(),s='Ημερομηνία & ώρα: '+n.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+n.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});document.querySelectorAll('.datetime').forEach(function(e){e.textContent=s})}clock();setInterval(clock,1000)})();(function(){var client=supabase.createClient('https://yblvmtaxorbdctvrpqer.supabase.co','sb_publishable_g5YEf2H_2yWoDM1DOzKtQw_qsCvc6ty'),authCard=document.getElementById('authCard'),shell=document.getElementById('appShell'),msg=document.getElementById('authMessage'),login=document.getElementById('loginButton'),admin=document.getElementById('adminButton'),nameEl=document.getElementById('signedInAs');async function enter(session){if(!session){authCard.hidden=false;shell.hidden=true;return}try{var r=await client.from('profiles').select('id,full_name,role,active').eq('id',session.user.id).single();if(r.error)throw r.error;if(!r.data.active)throw new Error('Ο λογαριασμός σας δεν είναι ενεργός.');if(r.data.role!=='admin'&&r.data.role!=='teacher')throw new Error('Ο λογαριασμός σας δεν έχει δικαίωμα πρόσβασης.');nameEl.textContent='Συνδεδεμένος: '+(r.data.full_name&&r.data.full_name.trim()?r.data.full_name:(r.data.role==='admin'?'T
