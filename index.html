<!DOCTYPE html>
<html lang="el">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Υπολογιστής Υπηρεσίας ΚΕΠ</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>


<body>


<div class="container">


<h1>
    Υπολογιστής Υπηρεσίας ΚΕΠ
</h1>


<!-- ==========================================
     ΕΠΙΛΟΓΗ ΚΕΠ
     ========================================== -->

<p>
    <strong>Επιλέξτε ΚΕΠ</strong>
</p>


<label>

    <input
        type="radio"
        name="kep"
        value="1"
        checked
    >

    ΚΕΠ 1

</label>


<label style="margin-left:1px;">

    <input
        type="radio"
        name="kep"
        value="2"
    >

    ΚΕΠ 2

</label>


<hr>


<!-- ==========================================
     ΥΠΗΡΕΣΙΑ ΚΕΠ 1
     ΕΜΦΑΝΙΖΕΤΑΙ ΜΟΝΟ ΣΤΟ ΚΕΠ 2
     ========================================== -->

<div
    id="kep1PreviousService"
    style="
        display:none;
        background:white;
        padding:15px;
        margin-bottom:15px;
        border-radius:8px;
    "
>

    <h3 style="margin-top:0;">
        Υπηρεσία ΚΕΠ 1
    </h3>


    <p>
        Συμπληρώστε την υπηρεσία που έχει πραγματοποιηθεί
        στο ΚΕΠ 1.
    </p>


    <div style="
        display:flex;
        gap:15px;
        flex-wrap:wrap;
    ">


        <label>

            Μήνες

            <input
                type="number"
                id="kep1Months"
                min="0"
                step="1"
                value="0"
                style="
                    width:80px;
                    margin-left:5px;
                "
            >

        </label>


        <label>

            Ημέρες

            <input
                type="number"
                id="kep1Days"
                min="0"
                max="29"
                step="1"
                value="0"
                style="
                    width:80px;
                    margin-left:5px;
                "
            >

        </label>


    </div>


    <div
        id="kep1InputStatus"
        style="
            margin-top:12px;
        "
    ></div>


    <!-- ======================================
         ΥΠΗΡΕΣΙΑ ΚΕΠ 2
         ΕΜΦΑΝΙΖΕΤΑΙ ΜΟΝΟ ΣΤΟ ΚΕΠ 2
         ====================================== -->

    <div
        id="kep2Section"
        style="
            display:none;
            background:white;
            padding:15px;
            margin-top:20px;
            border-radius:8px;
        "
    >

        <h3 style="margin-top:0;">
            Υπηρεσία ΚΕΠ 2
        </h3>


        <p>
            Συμπληρώστε την υπηρεσία που έχει πραγματοποιηθεί
            στο ΚΕΠ 2.
        </p>

    </div>


</div>


<!-- ==========================================
     ΗΜΕΡΟΜΗΝΙΕΣ
     ========================================== -->

<label>
    Ημερομηνία Ναυτολόγησης
</label>


<input
    type="date"
    id="embark"
>


<label>
    Ημερομηνία Απόλυσης
</label>


<input
    type="date"
    id="discharge"
>


<!-- ==========================================
     ΒΑΘΜΟΣ / ΕΙΔΙΚΟΤΗΤΑ
     ========================================== -->

<label>
    Βαθμός
</label>


<select id="rank">


    <option value="Δόκιμος Μηχανικός">
        Δόκιμος Μηχανικός
    </option>


    <option value="Καθαριστής">
        Καθαριστής
    </option>


    <option value="Μηχανοδηγός / Λιπαντής">
        Μηχανοδηγός / Λιπαντής
    </option>


    <option value="Βοηθός Ηλεκτρολόγου">
        Βοηθός Ηλεκτρολόγου
    </option>


    <option value="Δόκιμος Ηλεκτρολόγος">
        Δόκιμος Ηλεκτρολόγος
    </option>


</select>


<!-- ==========================================
     ΠΑΛΙΟ ΠΛΑΙΣΙΟ ΚΕΠ
     ΚΡΥΜΜΕΝΟ
     ========================================== -->

<div
    id="kepStatus"
    style="
        display:none;
    "
></div>


<!-- ==========================================
     ΠΡΟΣΘΗΚΗ ΤΑΞΙΔΙΟΥ
     ========================================== -->

<button id="addTrip">

    Προσθήκη Ταξιδιού

</button>


<!-- ==========================================
     ΛΙΣΤΑ ΤΑΞΙΔΙΩΝ
     ========================================== -->

<h2>

    Ταξίδια

</h2>


<div id="tripList">

    Δεν υπάρχουν ακόμη ταξίδια.

</div>


<!-- ==========================================
     ΥΠΟΛΟΓΙΣΜΟΣ
     ========================================== -->

<button id="calculate">

    Υπολογισμός Υπηρεσίας

</button>


<!-- ==========================================
     ΑΠΟΤΕΛΕΣΜΑ
     ========================================== -->

<div id="result"></div>


</div>


<script src="app.js?v=3"></script>


</body>

</html>
