<script>
'use strict';
const STORAGE_KEY='seaServiceArchive', $=id=>document.getElementById(id);
function records(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function normalizeGreek(v){return String(v??'').replace(/\b1\s+μήνες\b/gi,'1 μήνα').replace(/\b1\s+ημέρες\b/gi,'1 ημέρα').replace(/\b1\s+μέρες\b/gi,'1 μέρα')}
function dateObject(v){if(!v)return null;const s=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const [d,m,y]=s.split('/').map(Number);return new Date(y,m-1,d,12)}const d=new Date(s);return isNaN(d)?null:d}
function isoDate(v){const s=String(v||'');const m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:s}
function fmtDate(v){const d=dateObject(v);return d?d.toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'numeric',year:'numeric'}):'Δεν έχει καταχωρηθεί'}
function display(v,f='Δεν έχει καταχωρηθεί'){return v?esc(v):f}
function normalizedDecision(v){const s=String(v||'').trim();if(/^Απορριπτέα$/i.test(s))return'Μη επιτυχής';if(/^Επιτυχής$/i.test(s))return'Επιτυχής';return normalizeGreek(s)}
function serviceText(r){if(r.serviceText)return normalizeGreek(r.serviceText);const m=r.serviceMonths??r.months,d=r.serviceDays??r.days;if(m!==undefined||d!==undefined)return `${Number(m)||0} ${Number(m)===1?'μήνα':'μήνες'} και ${Number(d)||0} ${Number(d)===1?'ημέρα':'ημέρες'}`;if(r.totalMonths!==undefined||r.totalDays!==undefined)return `${Number(r.totalMonths)||0} ${Number(r.totalMonths)===1?'μήνα':'μήνες'} και ${Number(r.totalDays)||0} ${Number(r.totalDays)===1?'ημέρα':'ημέρες'}`;return normalizeGreek(r.result||'Δεν έχει καταχωρηθεί υπηρεσία')}
function getFiltered(){const reg=$('registryFilter').value.trim().toLowerCase(),name=$('nameFilter').value.trim().toLowerCase(),date=$('dateFilter').value;return records().filter(x=>(!reg||String(x.registryNumber||'').toLowerCase().includes(reg))&&(!name||String(x.fullName||'').toLowerCase().includes(name))&&(!date||isoDate(x.date)===date))}
function render(){const data=getFiltered(),box=$('archiveResults');if(!data.length){box.className='empty';box.textContent='Δεν βρέθηκαν καταχωρήσεις.';return}box.className='archive-list';box.innerHTML=data.map(x=>`<article class="record-card"><div class="record-grid"><div class="record-item"><strong>Ημερομηνία καταχώρισης</strong><div class="record-value">${display(fmtDate(x.date))}</div></div><div class="record-item"><strong>Ώρα καταχώρισης</strong><div class="record-value">${display(x.time)}</div></div><div class="record-item"><strong>Αριθμός Μητρώου</strong><div class="record-value">${display(x.registryNumber)}</div></div><div class="record-item"><strong>Ονοματεπώνυμο</strong><div class="record-value">${display(x.fullName)}</div></div><div class="record-item"><strong>ΚΕΠ</strong><div class="record-value">${display(x.kep)}</div></div><div class="record-item"><strong>Εξεταστής</strong><div class="record-value">${display(x.examiner)}</div></div><div class="record-item"><strong>Δικαιολογητικά</strong><div class="record-value">${display(x.documents)}</div></div><div class="record-item"><strong>Κατάσταση εξέτασης</strong><div class="record-value">${display(x.examinationStatus)}</div></div><div class="record-item"><strong>Βαθμός εξέτασης</strong><div class="record-value">${display(x.grade)}</div></div><div class="record-item"><strong>Τελικό αποτέλεσμα</strong><div class="record-value">${display(normalizedDecision(x.finalDecision))}</div></div></div><div class="result-box"><strong>Αποτέλεσμα / Παρατηρήσεις</strong><div>${display(normalizeGreek(x.result),'Δεν έχει καταχωρηθεί αποτέλεσμα')}</div></div><div class="record-actions"><button type="button" class="edit-record" data-id="${esc(x.id)}">✏️ Επεξεργασία</button><button type="button" class="delete-record" data-id="${esc(x.id)}">🗑️ Διαγραφή</button></div></article>`).join('');box.querySelectorAll('.edit-record').forEach(b=>b.onclick=()=>openEdit(b.dataset.id));box.querySelectorAll('.delete-record').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.id))}
function openEdit(id){const data=records(),i=data.findIndex(x=>String(x.id)===String(id));if(i<0)return;const r=data[i],wrap=document.createElement('div');wrap.id='editModal';wrap.innerHTML=`<div class="edit-backdrop"></div><div class="edit-dialog"><div class="edit-head"><strong>Επεξεργασία Εξέτασης ΚΕΠ</strong><button id="closeEdit" type="button">×</button></div><div class="edit-grid"><label>Ημερομηνία<input id="eDate" value="${esc(r.date)}"></label><label>Ώρα<input id="eTime" value="${esc(r.time)}"></label><label>Μητρώο<input id="eReg" value="${esc(r.registryNumber)}"></label><label>Ονοματεπώνυμο<input id="eName" value="${esc(r.fullName)}"></label><label>ΚΕΠ<input id="eKep" value="${esc(r.kep)}"></label><label>Εξεταστής<input id="eExaminer" value="${esc(r.examiner)}"></label><label>Δικαιολογητικά<select id="eDocs"><option>Δεν έχει ελεγχθεί</option><option>Εντάξει</option><option>Ελλιπή</option><option>Εκκρεμότητα</option><option>Δεν απαιτείται — ανεπαρκής υπηρεσία</option></select></label><label>Κατάσταση εξέτασης<select id="eStatus"><option>Δεν εξετάστηκε</option><option>Εξετάστηκε - Επιτυχής</option><option>Εξετάστηκε - Ανεπιτυχής</option><option>Δεν εξετάστηκε — ανεπαρκής υπηρεσία</option></select></label><label>Βαθμός<select id="eGrade"><option>Δεν βαθμολογήθηκε</option><option>Καλώς (5,00–6,49)</option><option>Λίαν Καλώς (6,50–8,49)</option><option>Άριστα (8,50–10,00)</option><option>Ανεπιτυχώς (0–4,99)</option></select></label><label>Τελικό αποτέλεσμα<select id="eDecision"><option>Σε αναμονή</option><option>Μπορεί να προχωρήσει</option><option>Δεν μπορεί να προχωρήσει</option><option>Δεν εξετάστηκε λόγω ανεπαρκούς υπηρεσίας</option><option>Δεν ολοκληρώθηκε λόγω ελλιπών δικαιολογητικών</option><option>Επιτυχής</option><option>Μη επιτυχής</option><option>Απορριπτέα</option></select></label><label class="edit-full">Αποτέλεσμα / Παρατηρήσεις<textarea id="eResult">${esc(r.result)}</textarea></label></div><div class="edit-foot"><button id="cancelEdit" type="button">Ακύρωση</button><button id="saveEdit" type="button">💾 Αποθήκευση αλλαγών</button></div></div>`;document.body.appendChild(wrap);[['eDocs',r.documents],['eStatus',r.examinationStatus],['eGrade',r.grade],['eDecision',r.finalDecision]].forEach(([id,v])=>{if(v)$(id).value=v});const close=()=>wrap.remove();$('closeEdit').onclick=close;$('cancelEdit').onclick=close;wrap.querySelector('.edit-backdrop').onclick=close;$('saveEdit').onclick=()=>{Object.assign(data[i],{date:$('eDate').value.trim(),time:$('eTime').value.trim(),registryNumber:$('eReg').value.trim(),fullName:$('eName').value.trim(),kep:$('eKep').value.trim(),examiner:$('eExaminer').value.trim(),documents:$('eDocs').value,examinationStatus:$('eStatus').value,grade:$('eGrade').value,finalDecision:$('eDecision').value,result:normalizeGreek($('eResult').value.trim()),success:$('eStatus').value==='Εξετάστηκε - Επιτυχής'||$('eDecision').value==='Επιτυχής'});localStorage.setItem(STORAGE_KEY,JSON.stringify(data));close();render()}}
function deleteRecord(id){if(!confirm('Να διαγραφεί οριστικά αυτή η εξέταση από το Αρχείο;'))return;localStorage.setItem(STORAGE_KEY,JSON.stringify(records().filter(x=>String(x.id)!==String(id))));render()}
function rangeData(data,mode,from,to,weekDate){if(mode==='all')return data;if(mode==='range')return data.filter(x=>{const d=isoDate(x.date);return(!from||d>=from)&&(!to||d<=to)});if(mode==='week'){const d=dateObject(weekDate)||new Date(),day=d.getDay()||7,monday=new Date(d);monday.setDate(d.getDate()-day+1);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);const f=`${monday.getFullYear()}-${String(monday.getMonth()+1).padStart(2,'0')}-${String(monday.getDate()).padStart(2,'0')}`,t=`${sunday.getFullYear()}-${String(sunday.getMonth()+1).padStart(2,'0')}-${String(sunday.getDate()).padStart(2,'0')}`;return data.filter(x=>{const v=isoDate(x.date);return v>=f&&v<=t})}return data}
function openPrintDialog(){const visible=getFiltered();if(!visible.length){alert('Δεν υπάρχουν καταχωρήσεις για εκτύπωση.');return}const wrap=document.createElement('div');wrap.id='printModal';wrap.innerHTML=`<div class="print-backdrop"></div><div class="print-dialog"><h2>📄 Εκτύπωση / Δημιουργία PDF</h2><p>Διάλεξε τι θέλεις να εκτυπώσεις.</p><div class="print-options"><label class="print-option"><input type="radio" name="printMode" value="all" checked> Ό,τι βλέπω τώρα</label><label class="print-option"><input type="radio" name="printMode" value="week"> Μία εβδομάδα</label><label class="print-option"><input type="radio" name="printMode" value="range"> Εύρος ημερομηνιών</label></div><div id="weekExtra" class="print-extra"><label>Ημερομηνία της εβδομάδας<input id="weekDate" type="date"></label><small>Θα εκτυπωθεί ολόκληρη η εβδομάδα Δευτέρα–Κυριακή που περιέχει αυτή την ημερομηνία.</small></div><div id="rangeExtra" class="print-extra"><label>Από<input id="modalFrom" type="date"></label><label>Έως<input id="modalTo" type="date"></label></div><div class="print-foot"><button id="cancelPrint" class="print-cancel" type="button">Ακύρωση</button><button id="goPrint" class="print-go" type="button">📄 Δημιουργία PDF</button></div></div>`;document.body.appendChild(wrap);const close=()=>wrap.remove();wrap.querySelector('.print-backdrop').onclick=close;$('cancelPrint').onclick=close;const updateExtra=()=>{const m=wrap.querySelector('input[name="printMode"]:checked').value;$('weekExtra').classList.toggle('open',m==='week');$('rangeExtra').classList.toggle('open',m==='range')};wrap.querySelectorAll('input[name="printMode"]').forEach(r=>r.onchange=updateExtra);$('goPrint').onclick=async()=>{const mode=wrap.querySelector('input[name="printMode"]:checked').value;if(mode==='range'&&$('modalFrom').value&&$('modalTo').value&&$('modalFrom').value>$('modalTo').value){alert('Η ημερομηνία «Από» δεν μπορεί να είναι μεταγενέστερη από την «Έως».');return}const data=rangeData(visible,mode,$('modalFrom').value,$('modalTo').value,$('weekDate').value);if(!data.length){alert('Δεν βρέθηκαν καταχωρήσεις για την επιλογή σου.');return}const win=window.open('about:blank','_blank');close();await makePdf(data,win)};updateExtra()}
function reportHtml(r){const ok=r.success===true||/επιτυχής/i.test(String(r.finalDecision||'')),state=ok?'ΕΠΙΤΥΧΗΣ':'ΜΗ ΕΠΙΤΥΧΗΣ',reason=normalizedDecision(r.finalDecision)||'Η εξέταση δεν ολοκληρώθηκε επιτυχώς.';return `<section class="pdf-report"><header class="pdf-head"><div class="pdf-brand">SeaService Calculator</div><div class="pdf-title">ΑΡΧΕΙΟ ΕΞΕΤΑΣΗΣ ΚΕΠ</div><div class="pdf-sub">Εκτύπωση εξέτασης</div></header><h2>ΣΤΟΙΧΕΙΑ ΝΑΥΤΙΚΟΥ</h2><table><tr><th>Αριθμός Μητρώου</th><td>${display(r.registryNumber,'—')}</td></tr><tr><th>Ονοματεπώνυμο</th><td>${display(r.fullName,'—')}</td></tr></table><h2>${display(r.kep,'ΚΕΠ')}</h2><table><tr><th>Ημερομηνία &amp; ώρα καταχώρισης</th><td>${display(fmtDate(r.date),'—')} — ${display(r.time,'—')}</td></tr><tr><th>Εξεταστής</th><td>${display(r.examiner,'—')}</td></tr><tr><th>Υπηρεσία</th><td>${esc(serviceText(r))}</td></tr><tr><th>Δικαιολογητικά</th><td>${display(r.documents,'—')}</td></tr><tr><th>Κατάσταση εξέτασης</th><td>${display(r.examinationStatus,'—')}</td></tr><tr><th>Βαθμολογία</th><td>${display(r.grade,'—')}</td></tr></table><h2>ΤΕΛΙΚΟ ΑΠΟΤΕΛΕΣΜΑ</h2><div class="final-box ${ok?'ok':''}"><div class="final-state">${state}</div><div class="final-details"><div><strong>Συνολική Υπηρεσία:</strong> ${esc(serviceText(r))}</div><div class="final-reason">${esc(reason)}</div>${r.result?`<div class="note"><strong>Παρατήρηση:</strong> ${esc(normalizeGreek(r.result))}</div>`:''}</div></div><footer><span>© 2026 SeaService Calculator. All rights reserved.</span><em>Σχεδιασμός &amp; Ανάπτυξη: Tassos Ballas</em></footer></section>`}
async function makePdf(data,win){if(!window.html2canvas||!window.jspdf){if(win&&!win.closed)win.close();alert('Δεν φορτώθηκαν οι βιβλιοθήκες PDF. Δοκίμασε ξανά μετά την πλήρη φόρτωση της σελίδας.');return}const holder=document.createElement('div');holder.style.cssText='position:fixed;left:0;top:0;width:794px;background:#fff;color:#111;z-index:-1;pointer-events:none';const css=document.createElement('style');css.textContent='.pdf-report{width:794px;height:1123px;background:#fff;padding:34px 28px 22px;font-family:Arial,sans-serif;color:#222;display:flex;flex-direction:column}.pdf-head{text-align:center;margin-bottom:20px}.pdf-brand{font-size:28px;font-weight:800;color:#214f83}.pdf-title{font-size:22px;font-weight:800;color:#214f83;margin-top:3px}.pdf-sub{font-size:13px;color:#777;margin-top:8px}.pdf-report h2{font-size:17px;color:#214f83;margin:14px 0 7px}.pdf-report table{width:100%;border-collapse:collapse;font-size:13px}.pdf-report th,.pdf-report td{border:1px solid #cfd6df;padding:8px 10px;text-align:left;vertical-align:middle}.pdf-report th{width:34%;background:#f0f3f7;font-weight:800}.pdf-report td{background:#fff}.final-box{border:1px solid #d9a7a7;background:#fff0f0;color:#a12626;padding:14px 18px;margin-top:4px}.final-box.ok{border-color:#a8c8ae;background:#eaf4ec;color:#1f6b35}.final-state{text-align:center;font-size:17px;font-weight:800;margin-bottom:12px}.final-details{font-size:13px;line-height:1.5}.final-reason{margin-top:8px}.note{margin-top:10px}.pdf-report footer{border-top:1px solid #d5dbe2;margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;font-size:10px;color:#777}.pdf-report footer em{font-style:italic}';holder.appendChild(css);data.forEach(r=>{const d=document.createElement('div');d.innerHTML=reportHtml(r);holder.appendChild(d.firstElementChild)});document.body.appendChild(holder);await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'}),margin=8,wmm=194,hmm=281,pages=holder.querySelectorAll('.pdf-report');try{for(let i=0;i<pages.length;i++){const canvas=await html2canvas(pages[i],{scale:1.5,useCORS:true,backgroundColor:'#fff',windowWidth:794,windowHeight:1123,scrollX:0,scrollY:0});if(!canvas.width||!canvas.height)throw new Error('Η σελίδα PDF δεν αποδόθηκε.');const pxPerMm=canvas.width/wmm;const maxPx=Math.floor(hmm*pxPerMm);let y=0;while(y<canvas.height){const sliceH=Math.min(maxPx,canvas.height-y),slice=document.createElement('canvas');slice.width=canvas.width;slice.height=sliceH;slice.getContext('2d').drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);if(i>0||y>0)pdf.addPage();pdf.addImage(slice.toDataURL('image/jpeg',.96),'JPEG',margin,margin,wmm,sliceH/pxPerMm);y+=sliceH}}const blob=pdf.output('blob');const url=URL.createObjectURL(blob);if(win&&!win.closed)win.location.href=url;else{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.click()}setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(e){console.error(e);if(win&&!win.closed)win.close();alert('Δεν μπόρεσε να δημιουργηθεί το PDF: '+(e.message||'άγνωστο σφάλμα'))}finally{holder.remove()}}
