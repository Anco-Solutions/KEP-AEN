<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SeaService Calculator</title>
<style>html,body,iframe{margin:0;padding:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style>
</head>
<body>
<iframe id="app" src="index.html?fresh=20260911"></iframe>
<script>
(function(){
  function fix(){
    var f=document.getElementById('app');
    var d=f&&f.contentDocument;
    if(!d)return;
    function place(){
      var p=d.getElementById('examinationPanel');
      var r=d.getElementById('result');
      if(!p||!r||!r.parentNode)return;
      if(p.parentNode!==r.parentNode||p.previousElementSibling!==r){r.parentNode.insertBefore(p,r.nextSibling);}
    }
    place();
    if(!d.__refreshOrderObserver){
      var root=d.querySelector('.container')||d.body;
      if(root){var mo=new MutationObserver(place);mo.observe(root,{childList:true,subtree:true});d.__refreshOrderObserver=true;}
    }
    [100,300,700,1200,2000,3000,5000,10000].forEach(function(ms){setTimeout(place,ms)});
  }
  document.getElementById('app').addEventListener('load',fix);
})();
</script>
</body>
</html>
