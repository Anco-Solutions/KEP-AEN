<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SeaService Calculator</title>
<style>html,body,iframe{margin:0;padding:0;width:100%;height:100%;border:0;overflow:hidden}iframe{display:block}</style>
</head>
<body>
<iframe id="app" src="index.html?fresh=20260911-4"></iframe>
<script>
(function(){
  function fix(){
    var f=document.getElementById('app');
    var d=f&&f.contentDocument;
    if(!d)return;
    function place(){
      var p=d.getElementById('examinationPanel'),r=d.getElementById('result');
      if(p&&r&&r.parentNode&&(p.parentNode!==r.parentNode||p.previousElementSibling!==r))r.parentNode.insertBefore(p,r.nextSibling);
    }
    place();
    var s=d.createElement('script');s.src='examination-final.js?v=2';d.body.appendChild(s);
    var a=d.createElement('script');a.src='actions-final.js?v=1';d.body.appendChild(a);
    if(!d.__refreshOrderObserver){var root=d.querySelector('.container')||d.body;if(root){var mo=new MutationObserver(place);mo.observe(root,{childList:true,subtree:true});d.__refreshOrderObserver=true;}}
    [100,300,700,1200,2000,3000,5000,10000].forEach(function(ms){setTimeout(place,ms)});
  }
  document.getElementById('app').addEventListener('load',fix);
})();
</script>
</body>
</html>
