<script>

(function(){

  function updateDateTime(){

    var now =
      new Date();


    var text =
      'Ημερομηνία & ώρα: ' +

      now.toLocaleDateString(
        'el-GR',
        {
          day:'2-digit',
          month:'2-digit',
          year:'numeric'
        }
      )

      +

      ' ' +

      now.toLocaleTimeString(
        'el-GR',
        {
          hour:'2-digit',
          minute:'2-digit',
          second:'2-digit',
          hour12:false
        }
      );


    document
      .querySelectorAll('.datetime')
      .forEach(function(el){

        el.textContent =
          text;

      });

  }


  updateDateTime();

  setInterval(
    updateDateTime,
    1000
  );

})();

</script>

<!-- =====================================================
     SUPABASE / USER / ADMIN
===================================================== -->

<script type="module">

import {
  createClient
}
from
'https://esm.sh/@supabase/supabase-js@2';


const s =
  createClient(
    'https://yblvmtaxorbdctvrpqer.supabase.co',
    'sb_publishable_g5YEf2H_2yWoDM1DOzKtQw_qsCvc6ty'
  );


async function sync(){

  const {
    data:{
      session
    }
  } =
    await s.auth.getSession();


  if(!session)
    return;


  const {
    data:p
  } =
    await s
      .from('profiles')
      .select(
        'id,full_name,role,active'
      )
      .eq(
        'id',
        session.user.id
      )
      .single();


  if(!p?.active)
    return;


  const n =
    document.getElementById(
      'signedInAs'
    );


  if(n){

    n.textContent =
      'Συνδεδεμένος: ' +

      (
        p.full_name?.trim() ||

        (
          p.role === 'admin'
            ? 'Tassos Ballas'
            : 'Χρήστης'
        )
      );

  }


  if(
    p.role === 'admin' &&
    !document.getElementById(
      'adminButton'
    )
  ){

    const a =
      document.createElement('a');


    a.id =
      'adminButton';


    a.className =
      'btn btn-secondary admin-button';


    a.href =
      'rebuild-test-admin.html?v=4';


    a.textContent =
      '⚙️ Διαχείριση';


    document
      .querySelector(
        '.header-actions'
      )
      ?.appendChild(a);

  }

}


sync();

setTimeout(
  sync,
  800
);

setTimeout(
  sync,
  2000
);

</script>


<!-- =====================================================
     ΚΕΠ 1 / ΚΕΠ 2 → ΣΥΝΕΧΕΙΑ
===================================================== -->

<script>

(function(){

  function updateNext(){

    var next =
      document.getElementById('kepNext');

    if(!next) return;

    var selected =
      document.querySelector(
        'input[name="kep"]:checked'
      );

    if(!selected){

      next.classList.remove('visible');

      next.style.display = 'none';

      next.href = '#';

      next.textContent =
        '➡️ Συνέχεια στο ΚΕΠ';

      return;
    }

    next.classList.add('visible');

    next.style.display = 'flex';

    if(selected.value === '1'){

      next.href =
        'rebuild-test-kep.html?kep=1';

      next.textContent =
        '➡️ Συνέχεια στο ΚΕΠ 1';

    }else if(selected.value === '2'){

      next.href =
        'rebuild-test-kep.html?kep=2';

      next.textContent =
        '➡️ Συνέχεια στο ΚΕΠ 2';

    }

  }


  /* Ακούμε το change σε όλη τη σελίδα.
     Έτσι δεν χάνεται η λειτουργία αν το app.js
     ξαναδημιουργήσει τα radio buttons. */

  document.addEventListener(
    'change',
    function(e){

      if(
        e.target &&
        e.target.name === 'kep'
      ){

        updateNext();

      }

    }
  );


  /* Αρχικός έλεγχος */

  updateNext();


  /* Έλεγχοι ασφαλείας μετά την αρχικοποίηση
     της εφαρμογής */

  setTimeout(updateNext,300);

  setTimeout(updateNext,1000);

  setTimeout(updateNext,2000);

  setTimeout(updateNext,3000);


})();

</script>
