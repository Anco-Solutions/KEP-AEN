<!DOCTYPE html><html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Διαχείριση Εξεταστών - SeaService Calculator</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#26344f}.container{max-width:650px;margin:30px auto;padding:22px}.card{background:#fff;border:1px solid #dfe3e8;border-radius:14px;padding:20px;box-shadow:0 3px 12px rgba(0,0,0,.06)}h1{font-size:22px;margin:0 0 6px}p{color:#69727e}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.delete{width:42px;height:36px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer}.add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:16px}input{min-height:44px;padding:8px 12px;border:1px solid #b9c1ca;border-radius:8px;font:inherit;box-sizing:border-box}.add button{border:0;border-radius:8px;padding:0 16px;background:#2673e8;color:white;font-weight:700;font:inherit}.back{display:inline-block;margin-bottom:18px;text-decoration:none;color:#315f9f;font-weight:700}@media(max-width:700px){.container{margin:10px auto;padding:14px}.add{grid-template-columns:1fr}.add button{min-height:44px}}</style></head><body><div class="container"><a class="back" href="index.html">← Επιστροφή στο SeaService Calculator</a><div class="card"><h1>Διαχείριση Εξεταστών</h1><p>Προσθέστε ή αφαιρέστε τους διαθέσιμους εξεταστές. Η ίδια λίστα χρησιμοποιείται για ΚΕΠ 1 και ΚΕΠ 2.</p><div id="list"></div><div class="add"><input id="name" type="text" autocomplete="name" placeholder="Ονοματεπώνυμο εξεταστή"><button id="add">＋ Προσθήκη εξεταστή</button></div></div><footer style="text-align:center;margin:28px 0 10px;font-size:12px;color:#777"><div>© 2026 SeaService Calculator. All rights reserved.</div><div style="font-style:italic;margin-top:3px">Σχεδιασμός &amp; Ανάπτυξη: Tassos Ballas</div></footer></div><script>const K='seaServiceExaminers';const read=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}};const write=v=>localStorage.setItem(K,JSON.stringify(v));const list=document.getElementById('list');function render(){const a=read();list.innerHTML=a.length?a.map((n,i)=>`<div class="row"><span>${n.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</span><button class="delete" data-i="${i}">🗑️</button></div>`).join(''):'<p>Δεν υπάρχουν ακόμη εξεταστές.</p>';document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>{const a=read(),i=+b.dataset.i;if(confirm('Να αφαιρεθεί ο εξεταστής;')){a.splice(i,1);write(a);render()}})}document.getElementById('add').onclick=()=>{const i=document.getElementById('name'),n=i.value.trim();if(!n){i.focus();return}const a=read();if(!a.some(x=>x.toLowerCase()===n.toLowerCase()))a.push(n);write(a);i.value='';render();i.focus()};document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('add').click()});render();</script></body></html>
