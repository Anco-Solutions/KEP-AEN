<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Καθηγητές — SeaService Calculator</title><link rel="stylesheet" href="styles.css?v=20260913-8"></head><body><main class="app"><header class="card app-header"><h1>Καθηγητές</h1><div id="who" class="signed-in"></div><div id="navBox"></div></header><section class="card"><h2>Διαχείριση καθηγητών</h2><p class="muted">Οι λογαριασμοί δημιουργούνται με πρόσκληση από το Supabase Auth. Από εδώ ο διαχειριστής ελέγχει ρόλο και ενεργή πρόσβαση.</p><div id="status" class="muted"></div><div id="list"></div></section><div id="footerBox"></div></main><script type="module">import{requireUser,supabase,nav,footer,wireLogout}from './portal.js?v=1';const p=await requireUser('admin');if(p){document.getElementById('who').textContent=`Συνδεδεμένος: ${p.full_name||p.email} (${p.role})`;document.getElementById('navBox').innerHTML=nav(p);document.getElementById('footerBox').innerHTML=footer();wireLogout();async function load(){status.textContent='Φόρτωση…';const{data,error}=await supabase.from('profiles').select('id,full_name,email,role,active,created_at').order('full_name');if(error){status.textContent='Σφάλμα: '+error.message;return}status.textContent='';list.innerHTML=(data||[]).map(x=>`<article class="card"><strong>${x.full_name||'Χωρίς ονοματεπώνυμο'}</strong><div>${x.email}</div><div class="field"><label>Ρόλος</label><select data-role="${x.id}"><option value="teacher" ${x.role==='teacher'?'selected':''}>Καθηγητής</option><option value="admin" ${x.role==='admin'?'selected':''}>Διαχειριστής</option></select></div><label class="kep-option"><input type="checkbox" data-active="${x.id}" ${x.active?'checked':''}> Ενεργός λογαριασμός</label></article>`).join('')||'<div class="muted">Δεν υπάρχουν λογαριασμοί.</div>';document.querySelectorAll('[data-role]').forEach(el=>el.addEventListener('change',async()=>{const{error}=await supabase.from('profiles').update({role:el.value}).eq('id',el.dataset.role);if(error)alert(error.message)}));document.querySelectorAll('[data-active]').forEach(el=>el.addEventListener('change',async()=>{const{error}=await supabase.from('profiles').update({active:el.checked}).eq('id',el.dataset.active);if(error){alert(error.message);el.checked=!el.checked}}))}load()}</script></body></html>
