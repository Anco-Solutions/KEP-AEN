<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ιστορικό — SeaService Calculator</title><link rel="stylesheet" href="styles.css?v=20260913-8"></head><body><main class="app"><header class="card app-header"><h1>Ιστορικό ενεργειών</h1><div id="who" class="signed-in"></div><div id="navBox"></div></header><section class="card"><h2>Audit / Ιστορικό</h2><div id="status" class="muted">Φόρτωση…</div><div id="list"></div></section><div id="footerBox"></div></main><script type="module">import{requireUser,supabase,nav,footer,wireLogout}from './portal.js?v=1';const p=await requireUser();if(p){document.getElementById('who').textContent=`Συνδεδεμένος: ${p.full_name||p.email} (${p.role})`;document.getElementById('navBox').innerHTML=nav(p);document.getElementById('footerBox').innerHTML=footer();wireLogout();const{data,error}=await supabase.from('audit_log').select('id,action,occurred_at,details,user:user_id(full_name,email),examination:examination_id(registry_number,full_name)').order('occurred_at',{ascending:false}).limit(300);if(error){status.textContent='Σφάλμα: '+error.message}else{status.textContent=`${(data||[]).length} καταγεγραμμένες ενέργειες`;list.innerHTML=(data||[]).map(x=>`<article class="card"><strong>${x.action}</strong><div>${x.examination?`${x.examination.full_name} · Μητρώο ${x.examination.registry_number}`:'Γενική ενέργεια'}</div><div class="muted">${x.user?.full_name||x.user?.email||'—'} · ${new Date(x.occurred_at).toLocaleString('el-GR')}</div><pre style="white-space:pre-wrap;overflow:auto;font-size:12px">${JSON.stringify(x.details||{},null,2)}</pre></article>`).join('')||'<div class="muted">Δεν υπάρχει ιστορικό.</div>'}}</script></body></html>
