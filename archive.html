<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SeaService Calculator — Αρχείο Εξέτασης ΚΕΠ</title>
<link rel="stylesheet" href="style.css">
<style>
.archive-page{max-width:900px;margin:20px auto;padding:16px}.archive-page h1{text-align:center}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:8px;margin:18px 0}.filters input,.filters button,.actions button{box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #ccc;font:inherit}.filters button,.actions button{cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.actions button{border:0;font-weight:700}.archive-list{display:flex;flex-direction:column;gap:12px}.record-card{background:#fff;border:1px solid #d8dce1;border-radius:10px;padding:14px;overflow-wrap:anywhere}.record-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e0e3e7;border-radius:8px;overflow:hidden}.record-item{padding:9px 10px;border-right:1px solid #e0e3e7;border-bottom:1px solid #e0e3e7;min-width:0}.record-item:nth-child(even){border-right:0}.record-item strong{display:block;font-size:11px;color:#68707a;margin-bottom:3px}.record-value{font-size:14px;font-weight:600}.result-box{margin-top:10px;padding:11px;border-radius:8px;background:#f7f8fa;border:1px solid #e3e5e8;white-space:pre-wrap}.result-box strong{display:block;margin-bottom:6px}.record-actions{display:flex;gap:8px;margin-top:10px}.record-actions button{padding:8px 12px;border:1px solid #d5d9dd;border-radius:8px;background:#fff;cursor:pointer;font:inherit}.empty{text-align:center;padding:28px;background:#fff;border-radius:10px}.footer{text-align:center;margin:35px 0 10px;font-size:13px;color:#777}.footer em{font-style:italic}.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;padding:11px 16px;border-radius:9px;text-decoration:none;font-weight:700;border:1px solid rgba(0,0,0,.12);background:#f5f7f9;color:inherit;box-shadow:0 2px 5px rgba(0,0,0,.08)}
@media(max-width:700px){.archive-page{width:100%;box-sizing:border-box;margin:0;padding:12px 10px}.archive-page h1{font-size:24px}.filters{grid-template-columns:1fr;gap:7px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{width:100%}.record-grid{grid-template-columns:1fr}.record-item,.record-item:nth-child(even){border-right:0}.record-card{padding:10px}.record-actions{display:grid;grid-template-columns:1fr 1fr}.record-actions button{width:100%}}
</style>
</head>
<body>
<main class="archive-page" id="archivePage">
<a class="back" href="index.html">← SeaService Calculator</a>
<h1>Αρχείο Εξέτασης ΚΕΠ</h1>
<p>Αναζήτηση παλαιών εξετάσεων με <strong>Μητρώο</strong>, <strong>Ονοματεπώνυμο</strong>, <strong>Ημερομηνία</strong> ή συνδυασμό.</p>
<div class="filters"><input id="registryFilter" placeholder="Αριθμός Μητρώου" inputmode="numeric"><input id="nameFilter" placeholder="Ονοματεπώνυμο"><input id="dateFilter" type="date"><button id="searchArchive" type="button">🔎 Αναζήτηση</button><button id="clearArchive" type="button">Καθαρισμός</button></div>
<div class="actions"><button id="printArchive" type="button">📄 Δημιουργία PDF</button><button id="emailArchive" type="button">✉️ Αποστολή με email</button></div>
<div id="archiveResults" class="empty">Δεν υπάρχουν ακόμη καταχωρήσεις στο Αρχείο.</div>
<div class="footer"><div>© 2026 SeaService Calculator. All rights reserved.</div><div>Σχεδιασμός &amp; Ανάπτυξη: <em>Tassos Ballas</em></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const STORAGE_KEY='seaServiceArchive';
const $=id=>document.getElementById(id);
function records(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return[]}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function isoDate(v){const m=String(v||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:String(v||'')}
function fmtDate(v){if(!v)return'Δεν έχει καταχωρηθεί';if(/^\d{2}\/\d{2}\/\d{4}$/.test(v))return v;const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function display(v,f='Δεν έχει καταχωρηθεί'){return v?esc(v):f}
function getFiltered(){const reg=$('registryFilter').value.trim().toLowerCase(),name=$('nameFilter').value.trim().toLowerCase(),date=$('dateFilter').value;return records().filter(x=>(!reg||String(x.registryNumber||'').toLowerCase().includes(reg))&&(!name||String(x.fullName||'').toLowerCase().includes(name))&&(!date||isoDate(x.date)===date))}
function render(){const data=getFiltered(),box=$('archiveResults');if(!data.length){box.className='empty';box.textContent='Δεν βρέθηκαν καταχωρήσεις.';return}box.className='archive-list';box.innerHTML=data.map(x=>`<article class="record-card" data-record-id="${esc(x.id)}"><div class="record-grid"><div class="record-item"><strong>Ημερομηνία καταχώρισης</strong><div class="record-value">${display(fmtDate(x.date))}</div></div><div class="record-item"><strong>Ώρα καταχώρισης</strong><div class="record-value">${display(x.time)}</div></div><div class="record-item"><strong>Αριθμός Μητρώου</strong><div class="record-value">${display(x.registryNumber)}</div></div><div class="record-item"><strong>Ονοματεπώνυμο</strong><div class="record-value">${display(x.fullName)}</div></div><div class="record-item"><strong>ΚΕΠ</strong><div class="record-value">${display(x.kep)}</div></div><div class="record-item"><strong>Υπηρεσία</strong><div class="record-value">${display(x.service)}</div></div><div class="record-item"><strong>Υπηρεσία ΚΕΠ 1</strong><div class="record-value">${display(x.serviceKep1)}</div></div><div class="record-item"><strong>Υπηρεσία ΚΕΠ 2</strong><div class="record-value">${display(x.serviceKep2)}</div></div><div class="record-item"><strong>Δικαιολογητικά</strong><div class="record-value">${display(x.documents)}</div></div><div class="record-item"><strong>Κατάσταση εξέτασης</strong><div class="record-value">${display(x.examinationStatus)}</div></div><div class="record-item"><strong>Βαθμός εξέτασης</strong><div class="record-value">${display(x.grade)}</div></div><div class="record-item"><strong>Τελική απόφαση</strong><div class="record-value">${display(x.finalDecision)}</div></div></div><div class="result-box"><strong>Αποτέλεσμα / Παρατηρήσεις</strong><div>${display(x.result,'Δεν έχει καταχωρηθεί αποτέλεσμα')}</div></div><div class="record-actions"><button type="button" class="edit-record">✏️ Επεξεργασία</button><button type="button" class="delete-record">🗑️ Διαγραφή</button></div></article>`).join('')}
function openEdit(id){const data=records(),i=data.findIndex(x=>String(x.id)===String(id));if(i<0)return;const r=data[i];const wrap=document.createElement('div');wrap.id='editModal';wrap.innerHTML=`<div class="edit-backdrop"></div><div class="edit-dialog"><div class="edit-head"><strong>Επεξεργασία Εξέτασης ΚΕΠ</strong><button id="closeEdit" type="button">×</button></div><div class="edit-grid"><label>Ημερομηνία<input id="eDate" value="${esc(r.date)}"></label><label>Ώρα<input id="eTime" value="${esc(r.time)}"></label><label>Μητρώο<input id="eReg" value="${esc(r.registryNumber)}"></label><label>Ονοματεπώνυμο<input id="eName" value="${esc(r.fullName)}"></label><label>ΚΕΠ<input id="eKep" value="${esc(r.kep)}"></label><label>Υπηρεσία<input id="eService" value="${esc(r.service)}"></label><label>Υπηρεσία ΚΕΠ 1<input id="eS1" value="${esc(r.serviceKep1)}"></label><label>Υπηρεσία ΚΕΠ 2<input id="eS2" value="${esc(r.serviceKep2)}"></label><label>Δικαιολογητικά<select id="eDocs"><option>Δεν έχει ελεγχθεί</option><option>Εντάξει</option><option>Ελλιπή</option></select></label><label>Κατάσταση εξέτασης<select id="eStatus"><option>Δεν εξετάστηκε</option><option>Εξετάστηκε - Επιτυχής</option><option>Εξετάστηκε - Ανεπιτυχής</option></select></label><label>Βαθμός<select id="eGrade"><option>Δεν βαθμολογήθηκε</option><option>Καλώς (5,00–6,49)</option><option>Λίαν Καλώς (6,50–8,49)</option><option>Άριστα (8,50–10,00)</option><option>Ανεπιτυχώς (0–4,99)</option></select></label><label>Τελική απόφαση<select id="eDecision"><option>Σε αναμονή</option><option>Μπορεί να προχωρήσει</option><option>Δεν μπορεί να προχωρήσει</option><option>Δεν εξετάστηκε λόγω ανεπαρκούς υπηρεσίας</option><option>Δεν ολοκληρώθηκε λόγω ελλιπών δικαιολογητικών</option></select></label><label class="edit-full">Αποτέλεσμα / Παρατηρήσεις<textarea id="eResult">${esc(r.result)}</textarea></label></div><div class="edit-foot"><button id="cancelEdit" type="button">Ακύρωση</button><button id="saveEdit" type="button">💾 Αποθήκευση αλλαγών</button></div></div>`;document.body.appendChild(wrap);[['eDocs',r.documents],['eStatus',r.examinationStatus],['eGrade',r.grade],['eDecision',r.finalDecision]].forEach(([id,v])=>{if(v)$(id).value=v});const close=()=>wrap.remove();$('closeEdit').onclick=close;$('cancelEdit').onclick=close;wrap.querySelector('.edit-backdrop').onclick=close;$('saveEdit').onclick=()=>{Object.assign(data[i],{date:$('eDate').value.trim(),time:$('eTime').value.trim(),registryNumber:$('eReg').value.trim(),fullName:$('eName').value.trim(),kep:$('eKep').value.trim(),service:$('eService').value.trim(),serviceKep1:$('eS1').value.trim(),serviceKep2:$('eS2').value.trim(),documents:$('eDocs').value,examinationStatus:$('eStatus').value,grade:$('eGrade').value,finalDecision:$('eDecision').value,result:$('eResult').value.trim(),success:$('eStatus').value==='Εξετάστηκε - Επιτυχής'&&$('eDecision').value==='Μπορεί να προχωρήσει'});localStorage.setItem(STORAGE_KEY,JSON.stringify(data));close();render()}}
function deleteRecord(id){if(!confirm('Να διαγραφεί οριστικά αυτή η εξέταση από το Αρχείο;'))return;localStorage.setItem(STORAGE_KEY,JSON.stringify(records().filter(x=>String(x.id)!==String(id))));render()}
function buildPdfBlob(){return new Promise(async(resolve,reject)=>{try{if(!window.html2canvas||!window.jspdf)throw new Error('PDF libraries not loaded');const source=$('archiveResults');const clone=source.cloneNode(true);clone.querySelectorAll('.record-actions').forEach(e=>e.remove());const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;padding:32px;box-sizing:border-box;color:#111;font-family:Arial,sans-serif;';const head=document.createElement('div');head.innerHTML='<h1 style="text-align:center;margin:0 0 8px;font-size:24px">Αρχείο Εξέτασης ΚΕΠ</h1><div style="text-align:center;margin-bottom:18px">SeaService Calculator</div>';holder.appendChild(head);holder.appendChild(clone);const foot=document.createElement('div');foot.style.cssText='text-align:center;margin-top:24px;font-size:11px;color:#777';foot.innerHTML='© 2026 SeaService Calculator. All rights reserved.<br>Σχεδιασμός &amp; Ανάπτυξη: <i>Tassos Ballas</i>';holder.appendChild(foot);document.body.appendChild(holder);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const canvas=await html2canvas(holder,{scale:2,useCORS:true,backgroundColor:'#fff,',scrollX:0,scrollY:0});holder.remove();const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});const pageW=210,pageH=297,margin=8,imgW=pageW-margin*2,imgH=canvas.height*imgW/canvas.width;let remaining=imgH,offset=0;pdf.addImage(canvas.toDataURL('image/jpeg',0.96),'JPEG',margin,margin,imgW,imgH);remaining-=pageH-margin*2;while(remaining>0){offset+=pageH-margin*2;pdf.addPage();pdf.addImage(canvas.toDataURL('image/jpeg',0.96),'JPEG',margin,margin-offset,imgW,imgH);remaining-=pageH-margin*2}resolve(pdf.output('blob'))}catch(e){reject(e)}})}
async function createPdf(){try{if(!getFiltered().length){alert('Δεν υπάρχουν αποτελέσματα για δημιουργία PDF.');return}const blob=await buildPdfBlob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Arxeio-Eksetasis-KEP.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}catch(e){console.error(e);alert('Δεν ήταν δυνατή η δημιουργία του PDF. Δοκιμάστε ξανά αφού φορτώσει πλήρως η σελίδα.')}}
async function sharePdf(){try{if(!getFiltered().length){alert('Δεν υπάρχουν αποτελέσματα για αποστολή.');return}const blob=await buildPdfBlob();const file=new File([blob],'Arxeio-Eksetasis-KEP.pdf',{type:'application/pdf'});const text='Επισυνάπτεται αρχείο εξέτασης ΚΕΠ.';if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:'Αρχείο Εξέτασης ΚΕΠ',text,files:[file]})}else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);alert('Το PDF δημιουργήθηκε. Από το Share επιλέξτε Mail για να το στείλετε ως συνημμένο.')}}catch(e){if(e&&e.name==='AbortError')return;console.error(e);alert('Δεν ήταν δυνατή η προετοιμασία του email/PDF.')}}
$('searchArchive').onclick=render;$('clearArchive').onclick=()=>{$('registryFilter').value='';$('nameFilter').value='';$('dateFilter').value='';render()};$('printArchive').onclick=createPdf;$('emailArchive').onclick=sharePdf;$('archiveResults').addEventListener('click',e=>{const card=e.target.closest('.record-card');if(!card)return;const id=card.dataset.recordId;if(e.target.closest('.edit-record'))openEdit(id);if(e.target.closest('.delete-record'))deleteRecord(id)});render();
</script>
<style>
#editModal{position:fixed;inset:0;z-index:9999}.edit-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}.edit-dialog{position:relative;z-index:1;width:min(720px,calc(100% - 24px));max-height:90vh;overflow:auto;margin:5vh auto;background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25);padding:16px;box-sizing:border-box}.edit-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:14px}.edit-head button{border:0;background:transparent;font-size:28px;cursor:pointer}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.edit-grid label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px}.edit-grid input,.edit-grid select,.edit-grid textarea{font:inherit;padding:9px;border:1px solid #ccc;border-radius:7px;box-sizing:border-box}.edit-grid textarea{min-height:90px;resize:vertical}.edit-full{grid-column:1/-1}.edit-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.edit-foot button{padding:10px 14px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;font:inherit}.edit-foot #saveEdit{font-weight:700}@media(max-width:600px){.edit-grid{grid-template-columns:1fr}.edit-full{grid-column:auto}.edit-foot{display:grid;grid-template-columns:1fr 1fr}.edit-foot button{width:100%}}
</style>
</body></html>
