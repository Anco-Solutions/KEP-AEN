<!DOCTYPE html>
<html lang="el">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SeaService Calculator — Αρχείο Εξέτασης ΚΕΠ</title><link rel="stylesheet" href="style.css"><style>
.archive-page{max-width:900px;margin:20px auto;padding:16px}.archive-page h1{text-align:center;margin-bottom:6px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:8px;margin:18px 0}.filters input,.filters button,.actions button{box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #ccc;font:inherit}.filters button,.actions button{cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.actions button{border:0;font-weight:600}.archive-list{display:flex;flex-direction:column;gap:12px}.record-card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px;box-sizing:border-box;overflow-wrap:anywhere}.record-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.record-item strong{display:block;font-size:12px;color:#666;margin-bottom:2px}.result-box{margin-top:12px;padding:10px;border-radius:8px;background:#f7f7f7;white-space:pre-wrap}.success{font-weight:700}.failed{font-weight:700}.empty{text-align:center;padding:28px;background:#fff;border-radius:10px}.footer{text-align:center;margin:35px 0 10px;font-size:13px;color:#777}.footer em{font-style:italic}.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;padding:11px 16px;border-radius:9px;text-decoration:none;font-weight:700;border:1px solid rgba(0,0,0,.12);background:#f5f7f9;color:inherit;box-shadow:0 2px 5px rgba(0,0,0,.08)}
@media(max-width:700px){.archive-page{width:100%;box-sizing:border-box;margin:0;padding:12px 10px}.archive-page h1{font-size:24px}.filters{grid-template-columns:1fr;gap:7px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{width:100%}.record-grid{grid-template-columns:1fr}.back{width:auto;box-sizing:border-box}.record-card{padding:12px}}
@media print{body{background:#fff!important}.archive-page{max-width:none;margin:0}.filters,.actions,.back{display:none!important}.footer{display:block!important}.record-card{break-inside:avoid}}
</style></head>
<body><main class="archive-page"><a class="back" href="index.html">← SeaService Calculator</a><h1>Αρχείο Εξέτασης ΚΕΠ</h1><p>Αναζήτηση παλαιών εξετάσεων με <strong>Μητρώο</strong>, <strong>Ονοματεπώνυμο</strong>, <strong>Ημερομηνία</strong> ή συνδυασμό.</p><div class="filters"><input id="registryFilter" placeholder="Αριθμός Μητρώου" inputmode="numeric"><input id="nameFilter" placeholder="Ονοματεπώνυμο"><input id="dateFilter" type="date"><button type="button" id="searchArchive">🔎 Αναζήτηση</button><button type="button" id="clearArchive">Καθαρισμός</button></div><div class="actions"><button type="button" id="printArchive">🖨️ Εκτύπωση / PDF</button><button type="button" id="emailArchive">✉️ Αποστολή με email</button></div><div id="archiveResults" class="empty">Δεν υπάρχουν ακόμη καταχωρήσεις στο Αρχείο.</div><div class="footer"><div>© 2026 SeaService Calculator. All rights reserved.</div><div>Σχεδιασμός &amp; Ανάπτυξη: <em>Tassos Ballas</em></div></div></main>
<script>
const STORAGE_KEY='seaServiceArchive';function records(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return[]}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fmtDate(v){if(!v)return'';if(/^\d{2}\/\d{2}\/\d{4}$/.test(v))return v;const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})}function render(){const reg=registryFilter.value.trim().toLowerCase(),name=nameFilter.value.trim().toLowerCase(),date=dateFilter.value;const data=records().filter(x=>(!reg||String(x.registryNumber||'').toLowerCase().includes(reg))&&(!name||String(x.fullName||'').toLowerCase().includes(name))&&(!date||x.date===date));const box=archiveResults;if(!data.length){box.className='empty';box.textContent='Δεν βρέθηκαν καταχωρήσεις.';return}box.className='archive-list';box.innerHTML=data.map(x=>`<article class="record-card"><div class="record-grid"><div class="record-item"><strong>Ημερομηνία</strong>${esc(fmtDate(x.date))}</div><div class="record-item"><strong>Ώρα καταχώρησης</strong>${esc(x.time||'')}</div><div class="record-item"><strong>Αριθμός Μητρώου</strong>${esc(x.registryNumber)}</div><div class="record-item"><strong>Ονοματεπώνυμο</strong>${esc(x.fullName)}</div><div class="record-item"><strong>ΚΕΠ</strong>${esc(x.kep)}</div><div class="record-item"><strong>Υπηρεσία</strong>${esc(x.service)}</div><div class="record-item"><strong>Δικαιολογητικά</strong>${esc(x.documents)}</div></div><div class="result-box"><strong>Αποτέλεσμα / Παρατηρήσεις</strong><div class="${x.success?'success':'failed'}">${esc(x.result)}</div></div></article>`).join('')}searchArchive.onclick=render;clearArchive.onclick=()=>{registryFilter.value='';nameFilter.value='';dateFilter.value='';render()};printArchive.onclick=()=>window.print();emailArchive.onclick=()=>{const q=[registryFilter.value.trim(),nameFilter.value.trim(),dateFilter.value].filter(Boolean).join(' | ');location.href='mailto:?subject='+encodeURIComponent('Αρχείο Εξέτασης ΚΕΠ'+(q?' — '+q:''))+'&body='+encodeURIComponent('Αρχείο Εξέτασης ΚΕΠ\nΚριτήρια: '+(q||'Όλα')+'\n\nΠαρακαλώ επισυνάψτε το PDF της εκτύπωσης του Αρχείου.')};render();
</script></body></html>
