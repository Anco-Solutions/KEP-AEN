<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SeaService Calculator — Αρχείο Εξέτασης ΚΕΠ</title><link rel="stylesheet" href="style.css">
<style>
.archive-page{max-width:1100px;margin:20px auto;padding:18px}.archive-page h1{text-align:center;margin-bottom:6px}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:8px;margin:18px 0}.filters input,.filters button,.actions button{padding:11px;border-radius:8px;border:1px solid #ccc;font:inherit}.filters button,.actions button{cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.actions button{border:0;font-weight:600}.archive-table{width:100%;border-collapse:collapse;background:#fff}.archive-table th,.archive-table td{padding:9px;border:1px solid #ddd;text-align:left;vertical-align:top}.archive-table th{background:#f5f5f5}.empty{text-align:center;padding:28px;background:#fff;border-radius:10px}.success{font-weight:bold}.failed{font-weight:bold}.footer{text-align:center;margin:35px 0 10px;font-size:13px;color:#777}.footer em{font-style:italic}.back{display:inline-block;margin-bottom:10px;padding:9px 14px;border-radius:8px;text-decoration:none}
@media(max-width:700px){.archive-page{width:100%;box-sizing:border-box;margin:0;padding:12px 10px}.archive-page h1{font-size:24px}.filters{grid-template-columns:1fr;gap:7px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{width:100%}.archive-table,.archive-table thead,.archive-table tbody,.archive-table tr,.archive-table th,.archive-table td{display:block;width:100%;box-sizing:border-box}.archive-table thead{display:none}.archive-table tr{margin-bottom:12px;border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff}.archive-table td{border:0;border-bottom:1px solid #eee;padding:9px 10px;display:grid;grid-template-columns:42% 58%;word-break:break-word}.archive-table td:last-child{border-bottom:0}.archive-table td::before{font-weight:700;content:attr(data-label)}}
@media print{body{background:#fff!important}.archive-page{max-width:none;margin:0}.filters,.actions,.back{display:none!important}.archive-table{font-size:10px}.footer{display:block!important}}
</style></head>
<body><main class="archive-page">
<a class="back" href="index.html">← SeaService Calculator</a>
<h1>Αρχείο Εξέτασης ΚΕΠ</h1>
<p>Αναζήτηση παλαιών εξετάσεων με <strong>Μητρώο</strong>, <strong>Ονοματεπώνυμο</strong>, <strong>Ημερομηνία</strong> ή συνδυασμό.</p>
<div class="filters"><input id="registryFilter" placeholder="Αριθμός Μητρώου" inputmode="numeric"><input id="nameFilter" placeholder="Ονοματεπώνυμο"><input id="dateFilter" type="date"><button type="button" id="searchArchive">🔎 Αναζήτηση</button><button type="button" id="clearArchive">Καθαρισμός</button></div>
<div class="actions"><button type="button" id="printArchive">🖨️ Εκτύπωση / PDF</button><button type="button" id="emailArchive">✉️ Αποστολή με email</button></div>
<div id="archiveResults" class="empty">Δεν υπάρχουν ακόμη καταχωρήσεις στο Αρχείο.</div>
<div class="footer">Designed &amp; Developed by <em>Tassos Ballas</em> <em>2026</em></div>
</main>
<script>
const STORAGE_KEY='seaServiceArchive';function records(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return[]}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){const reg=registryFilter.value.trim().toLowerCase(),name=nameFilter.value.trim().toLowerCase(),date=dateFilter.value;const data=records().filter(x=>(!reg||String(x.registryNumber||'').toLowerCase().includes(reg))&&(!name||String(x.fullName||'').toLowerCase().includes(name))&&(!date||x.date===date));const box=archiveResults;if(!data.length){box.className='empty';box.textContent='Δεν βρέθηκαν καταχωρήσεις.';return}box.className='';let html='<table class="archive-table"><thead><tr><th>Ημερομηνία</th><th>Μητρώο</th><th>Ονοματεπώνυμο</th><th>ΚΕΠ</th><th>Υπηρεσία</th><th>Δικαιολογητικά</th><th>Αποτέλεσμα / Παρατηρήσεις</th></tr></thead><tbody>';data.forEach(x=>{html+=`<tr><td data-label="Ημερομηνία">${esc(x.date)}</td><td data-label="Μητρώο">${esc(x.registryNumber)}</td><td data-label="Ονοματεπώνυμο">${esc(x.fullName)}</td><td data-label="ΚΕΠ">${esc(x.kep)}</td><td data-label="Υπηρεσία">${esc(x.service)}</td><td data-label="Δικαιολογητικά">${esc(x.documents)}</td><td data-label="Αποτέλεσμα / Παρατηρήσεις" class="${x.success?'success':'failed'}">${esc(x.result)}</td></tr>`});box.innerHTML=html+'</tbody></table>'}
searchArchive.onclick=render;clearArchive.onclick=()=>{registryFilter.value='';nameFilter.value='';dateFilter.value='';render()};printArchive.onclick=()=>window.print();emailArchive.onclick=()=>{const q=[registryFilter.value.trim(),nameFilter.value.trim(),dateFilter.value].filter(Boolean).join(' | ');location.href='mailto:?subject='+encodeURIComponent('Αρχείο Εξέτασης ΚΕΠ'+(q?' — '+q:''))+'&body='+encodeURIComponent('Αρχείο Εξέτασης ΚΕΠ\nΚριτήρια: '+(q||'Όλα')+'\n\nΠαρακαλώ επισυνάψτε το PDF της εκτύπωσης του Αρχείου.')};render();
</script></body></html>
