<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SeaService Calculator — Αρχείο Εξέτασης ΚΕΠ</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f2f7}
#appFrame{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="appFrame" src="archive-final.html?v=20260901-4" title="Αρχείο Εξέτασης ΚΕΠ"></iframe>
<script>
const frame=document.getElementById('appFrame');
let patched=false;
function patchMaster(){
  if(patched)return true;
  const w=frame.contentWindow;
  if(!w||typeof w.reportHtml!=='function')return false;
  w.reportHtml=function(r){
    const ok=w.finalStatus(r)==='ΕΠΙΤΥΧΗΣ';
    const bg=ok?'#eaf4ec':'#fbecec';
    const border=ok?'#a8c8ae':'#e0a0a0';
    const accent=ok?'#1f6b35':'#8f3030';
    const service=w.serviceText(r);
    const reason=ok?'Η εξέταση ολοκληρώθηκε επιτυχώς.':(r.result?w.normalizeGreek(r.result):'Η εξέταση δεν ολοκληρώθηκε επιτυχώς.');
    return `<section class="pdf-report">
<header class="header"><div class="brand">SeaService Calculator</div><div class="title">ΑΡΧΕΙΟ ΕΞΕΤΑΣΗΣ ΚΕΠ</div><div class="sub">Εκτύπωση εξέτασης</div></header>
<h2>ΣΤΟΙΧΕΙΑ ΝΑΥΤΙΚΟΥ</h2>
<table><tr><th>Αριθμός Μητρώου</th><td>${w.display(r.registryNumber,'—')}</td></tr><tr><th>Ονοματεπώνυμο</th><td>${w.display(r.fullName,'—')}</td></tr></table>
<h2>${w.display(r.kep,'ΚΕΠ')}</h2>
<table>
<tr><th>Ημερομηνία &amp; ώρα καταχώρισης</th><td>${w.display(w.fmtDateWeekday(r.date),'—')} — ${w.display(r.time,'—')}</td></tr>
<tr><th>Εξεταστής</th><td>${w.display(r.examiner,'—')}</td></tr>
${r.kep==='ΚΕΠ 1'?`<tr><th>Συνολική υπηρεσία</th><td>${w.esc(service)}</td></tr><tr><th>Ελάχιστη απαιτούμενη υπηρεσία</th><td>3 μήνες</td></tr><tr><th>Αποτέλεσμα υπολογισμού</th><td>${w.display(w.normalizeGreek(r.result),'—')}</td></tr>`:`<tr><th>Υπηρεσία ΚΕΠ 1 / προηγούμενη καταχώριση</th><td>Ανακτάται από το ίδιο Μητρώο όταν υπάρχει διαθέσιμη καταχώριση.</td></tr><tr><th>Νέα υπηρεσία ΚΕΠ 2</th><td>${w.esc(service)}</td></tr><tr><th>Αποτέλεσμα υπολογισμού</th><td>${w.display(w.normalizeGreek(r.result),'—')}</td></tr>`}
<tr><th>Δικαιολογητικά</th><td>${w.display(r.documents,'—')}</td></tr>
<tr><th>Κατάσταση εξέτασης</th><td>${w.display(r.examinationStatus,'—')}</td></tr>
<tr><th>Βαθμολογία</th><td>${w.display(r.grade,'—')}</td></tr>
</table>
<h2>ΤΕΛΙΚΟ ΑΠΟΤΕΛΕΣΜΑ</h2>
<div class="final-box" style="background:${bg};border-color:${border};color:${accent}">
<div class="final-state">${ok?'ΕΠΙΤΥΧΗΣ':'ΜΗ ΕΠΙΤΥΧΗΣ'}</div>
<div class="final-details">
<div class="service-line">Συνολική Υπηρεσία ${w.esc(service)}</div>
<div class="service-line">Υπηρεσία ανά Ειδικότητα</div>
<div class="service-line">${w.esc(r.rank||'Δόκιμος Μηχανικός')}</div>
<div class="service-line">${w.esc(service)}</div>
<div class="failure-line"><span class="failure-x">✖</span><span class="failure-text">${w.esc(reason)}</span></div>
<div class="cannot">${ok?'Η εξέταση ολοκληρώθηκε επιτυχώς.':'Το ΚΕΠ δεν μπορεί να εξεταστεί.'}</div>
</div>
</div>
<footer class="footer"><div class="footer-left"><div>© 2026 SeaService Calculator</div><div class="rights">All rights reserved.</div></div><div class="footer-right"><span class="credit-label">Σχεδιασμός &amp; Ανάπτυξη: </span><strong><em>Tassos Ballas</em></strong></div></footer>
</section>`;
  };
  w.makePdf=async function(data){
    if(!w.html2canvas||!w.jspdf){alert('Δεν φορτώθηκαν οι βιβλιοθήκες PDF. Δοκίμασε ξανά μετά την πλήρη φόρτωση της σελίδας.');return}
    const holder=w.document.createElement('div');
    holder.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#111';
    const css=w.document.createElement('style');
    css.textContent=`
.pdf-report{width:794px;min-height:1123px;background:#fff;padding:34px 28px 22px;box-sizing:border-box;font-family:Arial,sans-serif;color:#222;page-break-after:always;display:flex;flex-direction:column}
.pdf-report .header{text-align:center;margin-bottom:24px}.pdf-report .brand{font-size:28px;font-weight:800;color:#214f83}.pdf-report .title{font-size:22px;font-weight:800;color:#214f83;margin-top:3px}.pdf-report .sub{font-size:13px;color:#777;margin-top:8px}
.pdf-report h2{font-size:17px;color:#214f83;margin:16px 0 7px;letter-spacing:.2px}
.pdf-report table{width:100%;border-collapse:collapse;font-size:13px}.pdf-report th,.pdf-report td{border:1px solid #cfd6df;padding:8px 10px;text-align:left;vertical-align:middle}.pdf-report th{width:34%;background:#f0f3f7;font-weight:800}.pdf-report td{background:#fff}
.pdf-report .final-box{border:1px solid;padding:14px 18px;margin-top:4px;box-sizing:border-box;page-break-inside:avoid}.pdf-report .final-state{text-align:center;font-size:17px;font-weight:800;margin-bottom:12px}.pdf-report .final-details{text-align:left;font-size:13px;line-height:1.5}.pdf-report .service-line{margin:0 0 5px}.pdf-report .failure-line{margin-top:9px;display:flex;align-items:flex-start;gap:9px}.pdf-report .failure-x{font-size:22px;font-weight:900;line-height:1.1;flex:0 0 auto}.pdf-report .failure-text{font-weight:600}.pdf-report .cannot{text-align:center;font-size:14px;font-weight:800;margin-top:13px}
.pdf-report .footer{border-top:1px solid #d5dbe2;margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#777;line-height:1.35}.pdf-report .footer-left{text-align:left}.pdf-report .footer-left .rights{display:block}.pdf-report .footer-right{text-align:right;white-space:nowrap}.pdf-report .footer-right .credit-label{font-style:normal}.pdf-report .footer-right strong{font-weight:800}.pdf-report .footer-right em{font-style:italic}
`;
    holder.appendChild(css);
    data.forEach(r=>{const d=w.document.createElement('div');d.innerHTML=w.reportHtml(r);holder.appendChild(d.firstElementChild)});
    w.document.body.appendChild(holder);
    await new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));
    const {jsPDF}=w.jspdf;
    const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const margin=8,wmm=194,maxH=281;
    const pages=holder.querySelectorAll('.pdf-report');
    for(let i=0;i<data.length;i++){
      const page=pages[i];
      const canvas=await w.html2canvas(page,{scale:2,useCORS:true,backgroundColor:'#fff'});
      const pxPerMm=canvas.width/wmm;
      const pagePx=Math.floor(maxH*pxPerMm);
      let y=0,first=true;
      while(y<canvas.height){
        const sliceH=Math.min(pagePx,canvas.height-y);
        const slice=w.document.createElement('canvas');slice.width=canvas.width;slice.height=sliceH;
        slice.getContext('2d').drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);
        if(!first||i||y)pdf.addPage();
        pdf.addImage(slice.toDataURL('image/jpeg',.96),'JPEG',margin,margin,wmm,(sliceH/pxPerMm));
        first=false;y+=sliceH;
      }
    }
    holder.remove();
    const blob=pdf.output('blob');
    const url=w.URL.createObjectURL(blob);
    const opened=w.open(url,'_blank');
    if(!opened){const a=w.document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.click();}
    setTimeout(()=>w.URL.revokeObjectURL(url),60000);
  };
  patched=true;
  w.__masterPdfPatched=true;
  return true;
}
frame.addEventListener('load',()=>{
  if(patchMaster())return;
  const timer=setInterval(()=>{if(patchMaster())clearInterval(timer)},50);
  setTimeout(()=>clearInterval(timer),10000);
});
</script>
</body>
</html>
