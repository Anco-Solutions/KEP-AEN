<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SeaService Calculator — Αρχείο Εξέτασης ΚΕΠ</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f2f7}
#appFrame{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="appFrame" src="archive-final.html?v=20260901-2" title="Αρχείο Εξέτασης ΚΕΠ"></iframe>
<script>
const frame=document.getElementById('appFrame');
let patched=false;
function patchMaster(){
  if(patched)return true;
  const w=frame.contentWindow;
  if(!w)return false;
  const original=w.reportHtml;
  if(typeof original!=='function')return false;
  w.reportHtml=function(r){
    let html=original(r);
    try{
      const doc=new DOMParser().parseFromString(html,'text/html');

      // Το MASTER PDF δεν έχει καθόλου ξεχωριστή «Παρατήρηση» κάτω από το ΤΕΛΙΚΟ ΑΠΟΤΕΛΕΣΜΑ.
      // Αφαιρούμε το πραγματικό block από το παραγόμενο report, όχι μόνο μία συγκεκριμένη class.
      [...doc.body.querySelectorAll('*')].forEach(el=>{
        const text=(el.textContent||'').trim();
        if(/^Παρατήρηση\s*:/i.test(text) && el.children.length<=3){
          el.remove();
        }
      });

      // Υπογραφή: η φράση «Σχεδιασμός & Ανάπτυξη:» είναι κανονική γραφή.
      // Μόνο το «Tassos Ballas» είναι bold + italic.
      const credit=doc.querySelector('.footer-right');
      if(credit){
        credit.innerHTML='Σχεδιασμός &amp; Ανάπτυξη: <strong><em>Tassos Ballas</em></strong>';
        credit.style.fontStyle='normal';
      }else{
        [...doc.body.querySelectorAll('*')].forEach(el=>{
          if((el.textContent||'').includes('Σχεδιασμός & Ανάπτυξη:') && el.children.length<=4){
            el.innerHTML='Σχεδιασμός &amp; Ανάπτυξη: <strong><em>Tassos Ballas</em></strong>';
            el.style.fontStyle='normal';
          }
        });
      }
      return '<!DOCTYPE html>'+doc.documentElement.outerHTML;
    }catch(e){
      // Fallback για browsers όπου DOMParser δεν είναι διαθέσιμος.
      html=html.replace(/<div[^>]*>\s*Παρατήρηση\s*:[\s\S]*?<\/div>/gi,'');
      html=html.replace(/Σχεδιασμός\s*&amp;\s*Ανάπτυξη\s*:\s*(?:<[^>]*>)*Tassos Ballas(?:<[^>]*>)*/i,'Σχεδιασμός &amp; Ανάπτυξη: <strong><em>Tassos Ballas</em></strong>');
      return html;
    }
  };
  patched=true;
  w.__masterPdfPatched=true;
  return true;
}
frame.addEventListener('load',()=>{
  if(patchMaster())return;
  const timer=setInterval(()=>{if(patchMaster())clearInterval(timer)},50);
  setTimeout(()=>clearInterval(timer),10000);
});
</script>
</body>
</html>
