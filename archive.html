rder:1px solid #ccc;border-radius:8px;font:inherit}.edit-grid textarea{min-height:120px;resize:vertical}.edit-full{grid-column:1/-1}.edit-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.edit-foot button{padding:10px 14px;border:0;border-radius:8px;font-weight:700}.edit-foot button:last-child{background:#2673e8;color:#fff}

<body>
<main class="archive-page" id="archivePage">
<a class="back" href="index.html">← SeaService Calculator</a>
<h1>Αρχείο Εξέτασης ΚΕΠ</h1>
<p>Αναζήτηση παλαιών εξετάσεων με <strong>Μητρώο</strong>, <strong>Ονοματεπώνυμο</strong>, <strong>Ημερομηνία</strong> ή συνδυασμό.</p>
<div class="filters"><input id="registryFilter" placeholder="Αριθμός Μητρώου" inputmode="numeric"><input id="nameFilter" placeholder="Ονοματεπώνυμο"><input id="dateFilter" type="date" aria-label="Ημερομηνία"><button id="searchArchive" type="button">🔎 Αναζήτηση</button><button id="clearArchive" type="button">Καθαρισμός</button></div>
<div class="actions"><button id="printArchive" class="print-main" type="button"><span>📄 Εκτύπωση<br>PDF</span></button><button id="emailArchive" type="button">✉️ Αποστολή με email</button></div>
<div id="archiveResults" class="empty">Δεν υπάρχουν ακόμη καταχωρήσεις στο Αρχείο.</div>
<div class="footer"><div>© 2026 SeaService Calculator. All rights reserved.</div><div>Σχεδιασμός &amp; Ανάπτυξη: <em>Tassos Ballas</em></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const STORAGE_KEY='seaServiceArchive', $=id=>document.getElementById(id);
function records(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return[]}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function isoDate(v){const m=String(v||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:String(v||'')}
function fmtDate(v){if(!v)return'Δεν έχει καταχωρηθεί';if(/^\d{2}\/\d{2}\/\d{4}$/.test(v))return v;const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function display(v,f='Δεν έχει καταχωρηθεί'){return v?esc(v):f}
function getFiltered(){const reg=$('registryFilter').value.trim().toLowerCase(),name=$('nameFilter').value.trim().toLowerCase(),date=$('dateFilter').value;return records().filter(x=>(!reg||String(x.registryNumber||'').toLowerCase().includes(reg))&&(!name||String(x.fullName||'').toLowerCase().includes(name))&&(!date||isoDate(x.date)===date))}
function rangeData(data,mode,from,to,weekDate){if(mode==='all')return data;if(mode==='range')return data.filter(x=>{const d=isoDate(x.date);return(!from||d>=from)&&(!to||d<=to)});if(mode==='week'){const d=new Date((weekDate||new Date().toISOString().slice(0,10))+'T12:00:00'),day=d.getDay()||7,monday=new Date(d);monday.setDate(d.getDate()-day+1);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);const f=monday.toISOString().slice(0,10),t=sunday.toISOString().slice(0,10);return data.filter(x=>{const v=isoDate(x.date);return v>=f&&v<=t})}return data}
function render(){const data=getFiltered(),box=$('archiveResults');if(!data.length){box.className='empty';box.textContent='Δεν βρέθηκαν καταχωρήσεις.';return}box.className='archive-list';box.innerHTML=data.map(x=>`<article class="record-card" data-record-id="${esc(x.id)}"><div class="record-grid"><div class="record-item"><strong>Ημερομηνία καταχώρισης</strong><div class="record-value">${display(fmtDate(x.date))}</div></div><div class="record-item"><strong>Ώρα καταχώρισης</strong><div class="record-value">${display(x.time)}</div></div><div class="record-item"><strong>Αριθμός Μητρώου</strong><div class="record-value">${display(x.registryNumber)}</div></div><div class="record-item"><strong>Ονοματεπώνυμο</strong><div class="record-value">${display(x.fullName)}</div></div><div class="record-item"><strong>ΚΕΠ</strong><div class="record-value">${display(x.kep)}</div></div><div class="record-item"><strong>Εξεταστής</strong><div class="record-value">${display(x.examiner)}</div></div><div class="record-item"><strong>Δικαιολογητικά</strong><div class="record-value">${display(x.documents)}</div></div><div class="record-item"><strong>Κατάσταση εξέτασης</strong><div class="record-value">${display(x.examinationStatus)}</div></div><div class="record-item"><strong>Βαθμός εξέτασης</strong><div class="record-value">${display(x.grade)}</div></div><div class="record-item"><strong>Τελική απόφαση</strong><div class="record-value">${display(x.finalDecision)}</div></div></div><div class="result-box"><strong>Αποτέλεσμα / Παρατηρήσεις</strong><div>${display(x.result,'Δεν έχει καταχωρηθεί αποτέλεσμα')}</div></div><div class="record-actions"><button type="button" class="edit-record" data-id="${esc(x.id)}">✏️ Επεξεργασία</button><button type="button" class="delete-record" data-id="${esc(x.id)}">🗑️ Διαγραφή</button></div></article>`).join('');box.querySelectorAll('.edit-record').forEach(b=>b.onclick=()=>openEdit(b.dataset.id));box.querySelectorAll('.delete-record').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.id))}
function openEdit(id){const data=records(),i=data.findIndex(x=>String(x.id)===String(id));if(i<0)return;const r=data[i],wrap=document.createElement('div');wrap.id='editModal';wrap.innerHTML=`<div class="edit-backdrop"></div><div class="edit-dialog"><div class="edit-head"><strong>Επεξεργασία Εξέτασης ΚΕΠ</strong><button id="closeEdit" type="button">×</button></div><div class="edit-grid"><label>Ημερομηνία<input id="eDate" value="${esc(r.date)}"></label><label>Ώρα<input id="eTime" value="${esc(r.time)}"></label><label>Μητρώο<input id="eReg" value="${esc(r.registryNumber)}"></label><label>Ονοματεπώνυμο<input id="eName" value="${esc(r.fullName)}"></label><label>ΚΕΠ<input id="eKep" value="${esc(r.kep)}"></label><label>Εξεταστής<input id="eExaminer" value="${esc(r.examiner)}"></label><label>Δικαιολογητικά<select id="eDocs"><option>Δεν έχει ελεγχθεί</option><option>Εντάξει</option><option>Ελλιπή</option></select></label><label>Κατάσταση εξέτασης<select id="eStatus"><option>Δεν εξετάστηκε</option><option>Εξετάστηκε - Επιτυχής</option><option>Εξετάστηκε - Ανεπιτυχής</option></select></label><label>Βαθμός<select id="eGrade"><option>Δεν βαθμολογήθηκε</option><option>Καλώς (5,00–6,49)</option><option>Λίαν Καλώς (6,50–8,49)</option><option>Άριστα (8,50–10,00)</option><option>Ανεπιτυχώς (0–4,99)</option></select></label><label>Τελική απόφαση<select id="eDecision"><option>Σε αναμονή</option><option>Μπορεί να προχωρήσει</option><option>Δεν μπορεί να προχωρήσει</option><option>Δεν εξετάστηκε λόγω ανεπαρκούς υπηρεσίας</option><option>Δεν ολοκληρώθηκε λόγω ελλιπών δικαιολογητικών</option><option>Επιτυχής</option><option>Απορριπτέα</option></select></label><label class="edit-full">Αποτέλεσμα / Παρατηρήσεις<textarea id="eResult">${esc(r.result)}</textarea></label></div><div class="edit-foot"><button id="cancelEdit" type="button">Ακύρωση</button><button id="saveEdit" type="button">💾 Αποθήκευση αλλαγών</button></div></div>`;document.body.appendChild(wrap);[['eDocs',r.documents],['eStatus',r.examinationStatus],['eGrade',r.grade],['eDecision',r.finalDecision]].forEach(([id,v])=>{if(v)$(id).value=v});const close=()=>wrap.remove();$('closeEdit').onclick=close;$('cancelEdit').onclick=close;wrap.querySelector('.edit-backdrop').onclick=close;$('saveEdit').onclick=()=>{Object.assign(data[i],{date:$('eDate').value.trim(),time:$('eTime').value.trim(),registryNumber:$('eReg').value.trim(),fullName:$('eName').value.trim(),kep:$('eKep').value.trim(),examiner:$('eExaminer').value.trim(),documents:$('eDocs').value,examinationStatus:$('eStatus').value,grade:$('eGrade').value,finalDecision:$('eDecision').value,result:$('eResult').value.trim(),success:$('eStatus').value==='Εξετάστηκε - Επιτυχής'||$('eDecision').value==='Επιτυχής'});localStorage.setItem(STORAGE_KEY,JSON.stringify(data));close();render()}}
function deleteRecord(id){if(!confirm('Να διαγραφεί οριστικά αυτή η εξέταση από το Αρχείο;'))return;localStorage.setItem(STORAGE_KEY,JSON.stringify(records().filter(x=>String(x.id)!==String(id))));render()}
function openPrintDialog(){if(!getFiltered().length){alert('Δεν υπάρχουν καταχωρήσεις για εκτύπωση.');return}const wrap=document.createElement('div');wrap.id='printModal';wrap.innerHTML=`<div class="print-backdrop"></div><div class="print-dialog"><h2>📄 Εκτύπωση / Δημιουργία PDF</h2><p>Διάλεξε τι θέλεις να εκτυπώσεις.</p><div class="print-options"><label class="print-option"><input type="radio" name="printMode" value="all" checked> Ό,τι βλέπω τώρα</label><label class="print-option"><input type="radio" name="printMode" value="week"> Μία εβδομάδα</label><label class="print-option"><input type="radio" name="printMode" value="range"> Εύρος ημερομηνιών</label></div><div id="weekExtra" class="print-extra"><label>Ημερομηνία της εβδομάδας<input id="weekDate" type="date"></label><small>Θα εκτυπωθεί ολόκληρη η εβδομάδα Δευτέρα–Κυριακή που περιέχει αυτή την ημερομηνία.</small></div><div id="rangeExtra" class="print-extra"><label>Από<input id="modalFrom" type="date"></label><label>Έως<input id="modalTo" type="date"></label></div><div class="print-foot"><button id="cancelPrint" class="print-cancel" type="button">Ακύρωση</button><button id="goPrint" class="print-go" type="button">📄 Δημιουργία PDF</button></div></div>`;document.body.appendChild(wrap);const close=()=>wrap.remove();wrap.querySelector('.print-backdrop').onclick=close;$('cancelPrint').onclick=close;const updateExtra=()=>{const m=wrap.querySelector('input[name="printMode"]:checked').value;$('weekExtra').classList.toggle('open',m==='week');$('rangeExtra').classList.toggle('open',m==='range')};wrap.querySelectorAll('input[name="printMode"]').forEach(r=>r.onchange=updateExtra);$('goPrint').onclick=async()=>{const mode=wrap.querySelector('input[name="printMode"]:checked').value;if(mode==='range'&&$('modalFrom').value&&$('modalTo').value&&$('modalFrom').value>$('modalTo').value){alert('Η ημερομηνία «Από» δεν μπορεί να είναι μεταγενέστερη από την «Έως».');return}const data=rangeData(getFiltered(),mode,$('modalFrom').value,$('modalTo').value,$('weekDate').value);if(!data.length){alert('Δεν βρέθηκαν καταχωρήσεις για την επιλογή σου.');return}close();await makePdf(data)};updateExtra()}
function serviceText(r){if(Array.isArray(r.trips)&&r.trips.length){return `${r.trips.length} καταχωρημένα ταξίδια`};return 'Δεν έχει καταχωρηθεί υπηρεσία στο συγκεκριμένο αρχείο'}
function successRecord(r){return r.success===true||/ΕΠΙΤΥΧΗΣ|Επιτυχής|Μπορεί να προχωρήσει/i.test(String(r.finalDecision||''))}
function reportHtml(r){const ok=successRecord(r),bg=ok?'#eaf4ec':'#eef4fa',border=ok?'#a8c8ae':'#b8c9dc',accent='#214f83';const decision=String(r.finalDecision||'').trim();return `<section class="pdf-report"><header><div class="brand">SeaService Calculator</div><div class="pdf-title">ΑΡΧΕΙΟ ΕΞΕΤΑΣΗΣ ΚΕΠ</div><div class="pdf-sub">Επίσημη εκτύπωση εξέτασης</div></header><h2>ΣΤΟΙΧΕΙΑ ΝΑΥΤΙΚΟΥ</h2><table><tr><th>Αριθμός Μητρώου</th><td>${display(r.registryNumber,'—')}</td></tr><tr><th>Ονοματεπώνυμο</th><td>${display(r.fullName,'—')}</td></tr></table><h2>${display(r.kep,'ΚΕΠ')}</h2><table><tr><th>Ημερομηνία &amp; ώρα<br>καταχώρισης</th><td>${display(fmtDate(r.date),'—')} — ${display(r.time,'—')}</td></tr><tr><th>Εξεταστής</th><td>${display(r.examiner,'—')}</td></tr>${r.kep==='ΚΕΠ 1'?`<tr><th>Συνολική υπηρεσία</th><td>${serviceText(r)}</td></tr><tr><th>Ελάχιστη απαιτούμενη υπηρεσία</th><td>3 μήνες</td></tr><tr><th>Αποτέλεσμα υπολογισμού</th><td>${display(r.result,'—')}</td></tr>`:`<tr><th>Υπηρεσία ΚΕΠ 1 / προηγούμενη καταχώριση</th><td>Ανακτάται από το ίδιο Μητρώο όταν υπάρχει διαθέσιμη καταχώριση.</td></tr><tr><th>Νέα υπηρεσία ΚΕΠ 2</th><td>${serviceText(r)}</td></tr><tr><th>Αποτέλεσμα υπολογισμού</th><td>${display(r.result,'—')}</td></tr>`}<tr><th>Δικαιολογητικά</th><td>${display(r.documents,'—')}</td></tr><tr><th>Κατάσταση εξέτασης</th><td>${display(r.examinationStatus,'—')}</td></tr><tr><th>Βαθμολογία</th><td>${display(r.grade,'—')}</td></tr><tr><th>Τελικό αποτέλεσμα</th><td>${display(decision,'—')}</td></tr></table><h2>ΤΕΛΙΚΟ ΑΠΟΤΕΛΕΣΜΑ</h2><div class="final-box" style="background:${bg};border-color:${border};color:${accent}"><strong>${ok?'ΕΠΙΤΥΧΗΣ':'ΤΕΛΙΚΗ ΑΠΟΦΑΣΗ'}</strong><div>${display(decision,'Η τελική απόφαση παράγεται από τα καταχωρισμένα στοιχεία.')}</div></div>${r.result?`<div class="note"><strong>Παρατήρηση:</strong> ${esc(r.result).replace(/\n/g,'<br>')}</div>`:''}<footer><span>© 2026 SeaService Calculator. All rights reserved.</span><em>Σχεδιασμός &amp; Ανάπτυξη: Tassos Ballas</em></footer></section>`}
async function makePdf(data){if(!window.html2canvas||!window.jspdf){alert('Δεν φορτώθηκαν οι βιβλιοθήκες PDF. Δοκίμασε ξανά μετά την πλήρη φόρτωση της σελίδας.');return}const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;color:#111';const css=document.createElement('style');css.textContent=`.pdf-report{width:794px;background:#fff;padding:34px 28px 22px;font-family:Arial,sans-serif;color:#222;page-break-after:always}.pdf-report header{text-align:center;margin-bottom:24px}.brand{font-size:28px;font-weight:800;color:#214f83}.pdf-title{font-size:22px;font-weight:800;color:#214f83;margin-top:3px}.pdf-sub{font-size:13px;color:#777;margin-top:8px}.pdf-report h2{font-size:17px;color:#214f83;margin:16px 0 7px;letter-spacing:.2px}.pdf-report table{width:100%;border-collapse:collapse;font-size:13px}.pdf-report th,.pdf-report td{border:1px solid #cfd6df;padding:8px 10px;text-align:left;vertical-align:middle}.pdf-report th{width:34%;background:#f0f3f7;font-weight:800}.pdf-report td{background:#fff}.final-box{border:1px solid;padding:11px;text-align:center;margin-top:4px;font-size:13px}.final-box strong{display:block;font-size:16px;font-weight:800;margin-bottom:4px}.note{margin-top:12px;font-size:12px;line-height:1.35}.pdf-report footer{border-top:1px solid #d5dbe2;margin-top:26px;padding-top:8px;display:flex;justify-content:space-between;font-size:10px;color:#777}.pdf-report footer em{font-style:italic}`;holder.appendChild(css);data.forEach(r=>{const d=document.createElement('div');d.innerHTML=reportHtml(r);holder.appendChild(d.firstElementChild)});document.body.appendChild(holder);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});const margin=8,w=194,maxH=281;for(let i=0;i<data.length;i++){const page=holder.querySelectorAll('.pdf-report')[i],canvas=await html2canvas(page,{scale:2,useCORS:true,backgroundColor:'#fff'});let h=canvas.height*w/canvas.width;if(h>maxH)h=maxH;if(i)pdf.addPage();pdf.addImage(canvas.toDataURL('image/jpeg',.96),'JPEG',margin,margin,w,h)}pdf.save('Arxeio-Eksetasis-KEP.pdf');holder.remove()}
async function emailArchive(){const data=getFiltered();if(!data.length){alert('Δεν υπάρχουν καταχωρήσεις για αποστολή.');return}await makePdf(data);alert('Το PDF δημιουργήθηκε. Από την κοινή χρήση του iPhone μπορείς να επιλέξεις Mail και να σταλεί ως συνημμένο.')}
$('searchArchive').onclick=render;$('clearArchive').onclick=()=>{$('registryFilter').value='';$('nameFilter').value='';$('dateFilter').value='';render()};$('printArchive').onclick=openPrintDialog;$('emailArchive').onclick=openPrintDialog;render();
</script>
</body>
