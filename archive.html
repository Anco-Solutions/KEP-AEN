<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SeaService Calculator — Αρχείο Εξέτασης ΚΕΠ</title>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box}.archive-page{max-width:900px;margin:20px auto;padding:16px}.archive-page h1{text-align:center}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:8px;margin:18px 0}.filters input,.filters button{width:100%;padding:11px;border-radius:8px;border:1px solid #ccc;font:inherit}.filters button,.actions button{cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}.actions button{padding:11px 15px;border:0;border-radius:8px;font:inherit;font-weight:700}.archive-list{display:flex;flex-direction:column;gap:12px}.record-card{background:#fff;border:1px solid #d8dce1;border-radius:12px;padding:14px;overflow:hidden}.record-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e0e3e7;border-radius:8px;overflow:hidden}.record-item{padding:9px 10px;border-right:1px solid #e0e3e7;border-bottom:1px solid #e0e3e7;min-width:0}.record-item:nth-child(even){border-right:0}.record-item strong{display:block;font-size:11px;color:#68707a;margin-bottom:3px}.record-value{font-size:14px;font-weight:600;overflow-wrap:anywhere}.result-box{margin-top:10px;padding:11px;border-radius:8px;background:#f7f8fa;border:1px solid #e3e5e8;white-space:pre-wrap;overflow-wrap:anywhere}.result-box strong{display:block;margin-bottom:6px}.record-actions{display:flex;gap:8px;margin-top:10px}.record-actions button{padding:8px 12px;border:1px solid #d5d9dd;border-radius:8px;background:#fff;cursor:pointer;font:inherit}.empty{text-align:center;padding:28px;background:#fff;border-radius:10px}.footer{text-align:center;margin:35px 0 10px;font-size:13px;color:#777}.footer em{font-style:italic}.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:10px;padding:11px 16px;border-radius:9px;text-decoration:none;font-weight:700;border:1px solid rgba(0,0,0,.12);background:#f5f7f9;color:inherit;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.print-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998}.print-dialog{position:fixed;z-index:9999;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);background:#fff;border-radius:16px;padding:20px;box-shadow:0 18px 55px rgba(0,0,0,.28)}.print-dialog h2{margin:0 0 8px}.print-dialog p{margin:0 0 16px;color:#666}.print-options{display:grid;gap:9px}.print-option{display:flex;align-items:center;gap:10px;padding:13px;border:1px solid #d8dde3;border-radius:10px;background:#f8f9fb;cursor:pointer;font-weight:700}.print-option input{width:20px;height:20px;flex:0 0 auto}.print-extra{display:none;margin-top:10px;padding:12px;border:1px solid #e0e3e8;border-radius:10px;background:#fafafa}.print-extra.open{display:grid;gap:10px}.print-extra label{font-weight:700}.print-extra input{width:100%;margin-top:5px;padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit}.print-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.print-foot button{padding:10px 16px;border:0;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.print-cancel{background:#eef0f3}.print-go{background:#2673e8;color:#fff}
.edit-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998}.edit-dialog{position:fixed;z-index:9999;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:16px;box-shadow:0 15px 50px rgba(0,0,0,.25)}.edit-head{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-bottom:12px}.edit-head button{border:0;background:none;font-size:28px}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.edit-grid label{font-weight:700}.edit-grid input,.edit-grid select,.edit-grid textarea{width:100%;margin-top:5px;padding:9px;border:1px solid #ccc;border-radius:8px;font:inherit}.edit-grid textarea{min-height:120px;resize:vertical}.edit-full{grid-column:1/-1}.edit-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.edit-foot button{padding:10px 14px;border:0;border-radius:8px;font-weight:700}.edit-foot button:last-child{background:#2673e8;color:#fff}
@media(max-width:700px){.archive-page{width:100%;margin:0;padding:12px 10px}.archive-page h1{font-size:24px}.filters{grid-template-columns:1fr;gap:7px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions button{width:100%}.record-grid{grid-template-columns:1fr}.record-item,.record-item:nth-child(even){border-right:0}.record-card{padding:10px}.record-actions{display:grid;grid-template-columns:1fr 1fr}.record-actions button{width:100%}.edit-grid{grid-template-columns:1fr}.edit-full{grid-column:auto}.print-dialog{padding:16px}.print-foot{display:grid;grid-template-columns:1fr 1fr}.print-foot button{width:100%}}
@media print{.back,.filters,.actions,.record-actions{display:none!important}.archive-page{max-width:none;margin:0;padding:0}.record-card{break-inside:avoid;page-break-inside:avoid}.record-grid,.result-box{break-inside:avoid;page-break-inside:avoid}.footer{margin-top:20px}}
</style>
</head>
<body>
<main class="archive-page" id="archivePage">
<a class="back" href="index.html">← SeaService Calculator</a>
<h1>Αρχείο Εξέτασης ΚΕΠ</h1>
<p>Αναζήτηση παλαιών εξετάσεων με <strong>Μητρώο</strong>, <strong>Ονοματεπώνυμο</strong>, <strong>Ημερομηνία</strong> ή συνδυασμό.</p>
<div class="filters">
<input id="registryFilter" placeholder="Αριθμός Μητρώου" inputmode="numeric">
<input id="nameFilter" placeholder="Ονοματεπώνυμο">
<input id="dateFilter" type="date" aria-label="Ημερομηνία">
<button id="searchArchive" type="button">🔎 Αναζήτηση</button>
<button id="clearArchive" type="button">Καθαρισμός</button>
</div>
<div class="actions"><button id="printArchive" type="button">📄 Εκτύπωση / PDF</button><button id="emailArchive" type="button">✉️ Αποστολή με email</button></div>
<div id="archiveResults" class="empty">Δεν υπάρχουν ακόμη καταχωρήσεις στο Αρχείο.</div>
<div class="footer"><div>© 2026 SeaService Calculator. All rights reserved.</div><div>Σχεδιασμός &amp; Ανάπτυξη: <em>Tassos Ballas</em></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const STORAGE_KEY='seaServiceArchive';const $=id=>document.getElementById(id);
function records(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return[]}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function isoDate(v){const m=String(v||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:String(v||'')}
function fmtDate(v){if(!v)return'Δεν έχει καταχωρηθεί';if(/^\d{2}\/\d{2}\/\d{4}$/.test(v))return v;const d=new Date(v);return isNaN(d)?v:d.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function display(v,f='Δεν έχει καταχωρηθεί'){return v?esc(v):f}
function getFiltered(){const reg=$('registryFilter').value.trim().toLowerCase(),name=$('nameFilter').value.trim().toLowerCase(),date=$('dateFilter').value;return records().filter(x=>(!reg||String(x.registryNumber||'').toLowerCase().includes(reg))&&(!name||String(x.fullName||'').toLowerCase().includes(name))&&(!date||isoDate(x.date)===date))}
function rangeData(data,mode,from,to,weekDate){if(mode==='all')return data;if(mode==='range')return data.filter(x=>{const d=isoDate(x.date);return(!from||d>=from)&&(!to||d<=to)});if(mode==='week'){const d=new Date((weekDate||new Date().toISOString().slice(0,10))+'T12:00:00');const day=d.getDay()||7;const monday=new Date(d);monday.setDate(d.getDate()-day+1);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);const f=monday.toISOString().slice(0,10),t=sunday.toISOString().slice(0,10);return data.filter(x=>{const v=isoDate(x.date);return v>=f&&v<=t})}return data}
function render(){const data=getFiltered(),box=$('archiveResults');if(!data.length){box.className='empty';box.textContent='Δεν βρέθηκαν καταχωρήσεις.';return}box.className='archive-list';box.innerHTML=data.map(x=>`<article class="record-card" data-record-id="${esc(x.id)}"><div class="record-grid"><div class="record-item"><strong>Ημερομηνία καταχώρισης</strong><div class="record-value">${display(fmtDate(x.date))}</div></div><div class="record-item"><strong>Ώρα καταχώρισης</strong><div class="record-value">${display(x.time)}</div></div><div class="record-item"><strong>Αριθμός Μητρώου</strong><div class="record-value">${display(x.registryNumber)}</div></div><div class="record-item"><strong>Ονοματεπώνυμο</strong><div class="record-value">${display(x.fullName)}</div></div><div class="record-item"><strong>ΚΕΠ</strong><div class="record-value">${display(x.kep)}</div></div><div class="record-item"><strong>Εξεταστής</strong><div class="record-value">${display(x.examiner)}</div></div><div class="record-item"><strong>Δικαιολογητικά</strong><div class="record-value">${display(x.documents)}</div></div><div class="record-item"><strong>Κατάσταση εξέτασης</strong><div class="record-value">${display(x.examinationStatus)}</div></div><div class="record-item"><strong>Βαθμός εξέτασης</strong><div class="record-value">${display(x.grade)}</div></div><div class="record-item"><strong>Τελική απόφαση</strong><div class="record-value">${display(x.finalDecision)}</div></div></div><div class="result-box"><strong>Αποτέλεσμα / Παρατηρήσεις</strong><div>${display(x.result,'Δεν έχει καταχωρηθεί αποτέλεσμα')}</div></div><div class="record-actions"><button type="button" class="edit-record" data-id="${esc(x.id)}">✏️ Επεξεργασία</button><button type="button" class="delete-record" data-id="${esc(x.id)}">🗑️ Διαγραφή</button></div></article>`).join('');box.querySelectorAll('.edit-record').forEach(b=>b.onclick=()=>openEdit(b.dataset.id));box.querySelectorAll('.delete-record').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.id))}
function openEdit(id){const data=records(),i=data.findIndex(x=>String(x.id)===String(id));if(i<0)return;const r=data[i],wrap=document.createElement('div');wrap.id='editModal';wrap.innerHTML=`<div class="edit-backdrop"></div><div class="edit-dialog"><div class="edit-head"><strong>Επεξεργασία Εξέτασης ΚΕΠ</strong><button id="closeEdit" type="button">×</button></div><div class="edit-grid"><label>Ημερομηνία<input id="eDate" value="${esc(r.date)}"></label><label>Ώρα<input id="eTime" value="${esc(r.time)}"></label><label>Μητρώο<input id="eReg" value="${esc(r.registryNumber)}"></label><label>Ονοματεπώνυμο<input id="eName" value="${esc(r.fullName)}"></label><label>ΚΕΠ<input id="eKep" value="${esc(r.kep)}"></label><label>Εξεταστής<input id="eExaminer" value="${esc(r.examiner)}"></label><label>Δικαιολογητικά<select id="eDocs"><option>Δεν έχει ελεγχθεί</option><option>Εντάξει</option><option>Ελλιπή</option></select></label><label>Κατάσταση εξέτασης<select id="eStatus"><option>Δεν εξετάστηκε</option><option>Εξετάστηκε - Επιτυχής</option><option>Εξετάστηκε - Ανεπιτυχής</option></select></label><label>Βαθμός<select id="eGrade"><option>Δεν βαθμολογήθηκε</option><option>Καλώς (5,00–6,49)</option><option>Λίαν Καλώς (6,50–8,49)</option><option>Άριστα (8,50–10,00)</option><option>Ανεπιτυχώς (0–4,99)</option></select></label><label>Τελική απόφαση<select id="eDecision"><option>Σε αναμονή</option><option>Μπορεί να προχωρήσει</option><option>Δεν μπορεί να προχωρήσει</option><option>Δεν εξετάστηκε λόγω ανεπαρκούς υπηρεσίας</option><option>Δεν ολοκληρώθηκε λόγω ελλιπών δικαιολογητικών</option></select></label><label class="edit-full">Αποτέλεσμα / Παρατηρήσεις<textarea id="eResult">${esc(r.result)}</textarea></label></div><div class="edit-foot"><button id="cancelEdit" type="button">Ακύρωση</button><button id="saveEdit" type="button">💾 Αποθήκευση αλλαγών</button></div></div>`;document.body.appendChild(wrap);[['eDocs',r.documents],['eStatus',r.examinationStatus],['eGrade',r.grade],['eDecision',r.finalDecision]].forEach(([id,v])=>{if(v)$(id).value=v});const close=()=>wrap.remove();$('closeEdit').onclick=close;$('cancelEdit').onclick=close;wrap.querySelector('.edit-backdrop').onclick=close;$('saveEdit').onclick=()=>{Object.assign(data[i],{date:$('eDate').value.trim(),time:$('eTime').value.trim(),registryNumber:$('eReg').value.trim(),fullName:$('eName').value.trim(),kep:$('eKep').value.trim(),examiner:$('eExaminer').value.trim(),documents:$('eDocs').value,examinationStatus:$('eStatus').value,grade:$('eGrade').value,finalDecision:$('eDecision').value,result:$('eResult').value.trim(),success:$('eStatus').value==='Εξετάστηκε - Επιτυχής'&&$('eDecision').value==='Μπορεί να προχωρήσει'});localStorage.setItem(STORAGE_KEY,JSON.stringify(data));close();render()}}
function deleteRecord(id){if(!confirm('Να διαγραφεί οριστικά αυτή η εξέταση από το Αρχείο;'))return;localStorage.setItem(STORAGE_KEY,JSON.stringify(records().filter(x=>String(x.id)!==String(id))));render()}
function openPrintDialog(){if(!getFiltered().length){alert('Δεν υπάρχουν καταχωρήσεις για εκτύπωση.');return}const wrap=document.createElement('div');wrap.id='printModal';wrap.innerHTML=`<div class="print-backdrop"></div><div class="print-dialog"><h2>📄 Εκτύπωση / Δημιουργία PDF</h2><p>Διάλεξε τι θέλεις να εκτυπώσεις.</p><div class="print-options"><label class="print-option"><input type="radio" name="printMode" value="all" checked> Ό,τι βλέπω τώρα</label><label class="print-option"><input type="radio" name="printMode" value="week"> Μία εβδομάδα</label><label class="print-option"><input type="radio" name="printMode" value="range"> Εύρος ημερομηνιών</label></div><div id="weekExtra" class="print-extra"><label>Ημερομηνία της εβδομάδας<input id="weekDate" type="date"></label><small>Θα εκτυπωθεί ολόκληρη η εβδομάδα Δευτέρα–Κυριακή που περιέχει αυτή την ημερομηνία.</small></div><div id="rangeExtra" class="print-extra"><label>Από<input id="modalFrom" type="date"></label><label>Έως<input id="modalTo" type="date"></label></div><div class="print-foot"><button id="cancelPrint" class="print-cancel" type="button">Ακύρωση</button><button id="goPrint" class="print-go" type="button">📄 Δημιουργία PDF</button></div></div>`;document.body.appendChild(wrap);const close=()=>wrap.remove();wrap.querySelector('.print-backdrop').onclick=close;$('cancelPrint').onclick=close;const updateExtra=()=>{const m=wrap.querySelector('input[name="printMode"]:checked').value;$('weekExtra').classList.toggle('open',m==='week');$('rangeExtra').classList.toggle('open',m==='range')};wrap.querySelectorAll('input[name="printMode"]').forEach(r=>r.onchange=updateExtra);$('goPrint').onclick=async()=>{const mode=wrap.querySelector('input[name="printMode"]:checked').value;if(mode==='range'&&$('modalFrom').value&&$('modalTo').value&&$('modalFrom').value>$('modalTo').value){alert('Η ημερομηνία «Από» δεν μπορεί να είναι μεταγενέστερη από την «Έως».');return}const data=rangeData(getFiltered(),mode,$('modalFrom').value,$('modalTo').value,$('weekDate').value);if(!data.length){alert('Δεν βρέθηκαν καταχωρήσεις για την επιλογή σου.');return}close();await makePdf(data)};updateExtra()}
async function makePdf(data){if(!window.html2canvas||!window.jspdf){alert('Δεν φορτώθηκαν οι βιβλιοθήκες PDF. Δοκίμασε ξανά μετά την πλήρη φόρτωση της σελίδας.');return}const source=$('archiveResults');const wanted=new Set(data.map(x=>String(x.id)));const cards=[...source.querySelectorAll('.record-card')].filter(c=>wanted.has(String(c.dataset.recordId)));const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:#fff;padding:30px;color:#111;font-family:Arial,sans-serif';holder.innerHTML='<h1 style="text-align:center;font-size:24px;margin:0 0 5px">Αρχείο Εξέτασης ΚΕΠ</h1><p style="text-align:center;margin:0 0 18px;color:#666">SeaService Calculator</p>';const list=document.createElement('div');list.style.cssText='display:flex;flex-direction:column;gap:12px';cards.forEach(c=>{const clone=c.cloneNode(true);clone.querySelectorAll('.record-actions').forEach(e=>e.remove());clone.style.breakInside='avoid';clone.style.pageBreakInside='avoid';list.appendChild(clone)});holder.appendChild(list);const foot=document.createElement('div');foot.style.cssText='text-align:center;margin-top:22px;color:#777;font-size:12px';foot.innerHTML='© 2026 SeaService Calculator. All rights reserved.<br>Σχεδιασμός &amp; Ανάπτυξη: <em>Tassos Ballas</em>';holder.appendChild(foot);document.body.appendChild(holder);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});const pageW=210,pageH=297,margin=10,imgW=pageW-margin*2,usableH=pageH-margin*2;let y=margin;let has=false;for(const card of [...list.children]){const c=await html2canvas(card,{scale:2,useCORS:true,backgroundColor:'#fff'});let h=c.height*imgW/c.width;if(h>usableH)h=usableH;if(has&&y+h>pageH-margin){pdf.addPage();y=margin;has=false}pdf.addImage(c.toDataURL('image/jpeg',.95),'JPEG',margin,y,imgW,h);y+=h+4;has=true}pdf.save('Arxeio-Eksetasis-KEP.pdf');holder.remove()}
async function emailArchive(){const data=getFiltered();if(!data.length){alert('Δεν υπάρχουν καταχωρήσεις για αποστολή.');return}await makePdf(data);alert('Το PDF δημιουργήθηκε. Από την κοινή χρήση του iPhone μπορείς να επιλέξεις Mail και να σταλεί ως συνημμένο.')}
$('searchArchive').onclick=render;$('clearArchive').onclick=()=>{$('registryFilter').value='';$('nameFilter').value='';$('dateFilter').value='';render()};$('printArchive').onclick=openPrintDialog;$('emailArchive').onclick=openPrintDialog;render();
</script>
</body>
</html>
