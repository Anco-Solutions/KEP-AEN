<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SeaService Calculator — ΚΕΠ</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f6fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{display:flex;justify-content:center}.app{width:min(100%,560px);padding:18px 14px 14px}h1{margin:0;text-align:center;color:#0b477f;font-size:24px;line-height:1.1;font-weight:800}.datetime{text-align:center;margin:7px 0 10px;color:#596579;font-size:13px;font-weight:700}.header,.card{background:#fff;border:1px solid #dfe5ed;border-radius:16px;padding:13px 14px;margin-bottom:8px;box-shadow:0 4px 18px rgba(20,45,75,.06)}.signed{text-align:center;font-size:13px;font-weight:800;margin-bottom:8px;color:#364154}.bar{display:flex;gap:7px}.bar a,.bar button,.bottom button{display:flex;align-items:center;justify-content:center;height:38px;border-radius:9px;border:1px solid #d5dbe3;background:#f7f9fb;color:#172033;font-size:12.5px;font-weight:800;text-decoration:none}.bar a{flex:1}.kep-title{text-align:center;color:#0b477f;font-size:18px;font-weight:800;margin:2px 0 10px}.field{margin-bottom:10px}.field label{display:block;margin-bottom:4px;font-size:13px;font-weight:800;color:#364154}input,select{display:block;width:100%;height:40px;padding:7px 10px;border:1px solid #cbd3df;border-radius:9px;background:#fff;color:#172033;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.btn{width:100%;height:38px;border:0;border-radius:9px;background:#31598f;color:#fff;font-weight:800;font-size:13px}.trip{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e0e5eb;border-radius:9px;padding:8px 10px;margin:6px 0;font-size:12.5px}.trip button{border:0;background:none;color:#b42318;font-weight:800}.result{margin-top:9px;padding:10px;border-radius:9px;background:#eef4fb;border:1px solid #cbdced;font-size:13px;line-height:1.4}.result.pending{background:#fff8e6;border-color:#ead7a3}.exam{display:none}.exam.visible{display:block}.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border:1px solid #cbd3df;border-radius:9px;font-size:13px;font-weight:800}.choice input{width:17px;height:17px;min-height:17px;margin:0}.grade-wrap{display:none;margin-top:9px}.grade-wrap.visible{display:block}.decision{margin-top:9px;padding:10px;border-radius:9px;border:1px solid #cbd3df;background:#f7f9fb;text-align:center;font-weight:900;font-size:13px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.bottom button:first-child{background:#f7f9fb}.bottom button:last-child{background:#31598f;color:#fff;border-color:#31598f}.footer{text-align:center;font-size:10.5px;color:#8a94a3;margin-top:10px}.footer b{font-style:italic;color:#687384}.hidden{display:none!important}</style></head><body><main class="app"><header class="header"><h1>SeaService Calculator</h1><div id="clock" class="datetime"></div><div id="signed" class="signed"></div><div class="bar"><a href="rebuild-test-login.html?v=9">← Αρχική</a><a href="rebuild-test-archive.html?v=6">📁 Αρχείο</a></div></header><section class="card"><div id="kepTitle" class="kep-title"></div><div class="grid2"><div class="field"><label>Μητρώο εξεταζόμενου</label><input id="registry" readonly></div><div class="field"><label>ΚΕΠ</label><input id="kepValue" readonly></div></div><div class="field"><label for="fullName">Ονοματεπώνυμο εξεταζόμενου</label><input id="fullName"></div><div class="field"><label for="examiner">Εξεταστής</label><select id="examiner"><option value="">— Επιλέξτε εξεταστή —</option></select></div></section><section class="card"><div class="field"><label>Υπηρεσία</label><div class="grid2"><div><label for="embark">Ναυτολόγηση</label><input id="embark" type="date"></div><div><label for="discharge">Απόλυση</label><input id="discharge" type="date"></div></div></div><button id="addTrip" class="btn">＋ Προσθήκη ταξιδιού</button><div id="tripList"></div><button id="calculate" class="btn">Υπολογισμός συγκεντρωμένης υπηρεσίας</button><div id="result" class="result">Συμπληρώστε τα ταξίδια και πατήστε υπολογισμό.</div><div id="previous" class="hidden"><div id="previousText"></div><div class="grid2"><div class="field"><label>Προηγούμενοι μήνες ΚΕΠ 1</label><input id="prevM" type="number" min="0"></div><div class="field"><label>Προηγούμενες ημέρες ΚΕΠ 1</label><input id="prevD" type="number" min="0" max="29"></div></div></div></section><section id="exam" class="card exam"><h2 style="font-size:16px;margin:0 0 9px">Εξέταση</h2><div class="field"><label>Δικαιολογητικά</label><div class="choice-row"><label class="choice"><input type="radio" name="docs" value="unchecked">Δεν έχουν ελεγχθεί</label><label class="choice"><input type="radio" name="docs" value="full">Πλήρη</label></div><div style="margin-top:7px"><label class="choice"><input type="radio" name="docs" value="incomplete">Ελλιπή</label></div></div><div class="field"><label>Εξέταση</label><div class="choice-row"><label class="choice"><input type="radio" name="examStatus" value="pending" checked>Εκκρεμεί</label><label class="choice"><input id="completed" type="radio" name="examStatus" value="completed">Ολοκληρώθηκε</label></div></div><div id="gradeWrap" class="grade-wrap"><div class="field"><label for="grade">Βαθμός εξέτασης (0–10)</label><input id="grade" type="number" min="0" max="10" step="0.01"></div><div id="classification" class="result"></div><div id="decision" class="decision">ΤΕΛΙΚΗ ΑΠΟΦΑΣΗ: Σε εκκρεμότητα</div></div></section><div class="bottom"><button id="back">← Επιστροφή</button><button id="save">Αποθήκευση & Επιστροφή</button></div><footer class="footer">© 2026 <b>Tassos Ballas</b> · All rights reserved.</footer></main><script>
(function(){const p=new URLSearchParams(location.search),k=p.get('kep')==='2'?'2':'1';document.getElementById('kepTitle').textContent='ΚΕΠ '+k+' — Στοιχεία εξέτασης';document.getElementById('kepValue').value='ΚΕΠ '+k;function clock(){const n=new Date();document.getElementById('clock').textContent='Ημερομηνία & ώρα: '+n.toLocaleDateString('el-GR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+n.toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})}clock();setInterval(clock,1000);try{const x=JSON.parse(sessionStorage.getItem('seaServiceCandidate')||'{}');document.getElementById('registry').value=x.registry||'';document.getElementById('fullName').value=x.fullName||'';document.getElementById('signed').textContent=x.signed||''}catch(e){};try{const list=JSON.parse(localStorage.getItem('seaServiceExaminers')||'[]');if(Array.isArray(list))list.map(String).map(s=>s.trim()).filter(Boolean).forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;document.getElementById('examiner').appendChild(o)})}catch(e){};const trips=[];function leap(y){return y%4===0&&(y%100!==0||y%400===0)}function len(y,m){return m===2?(leap(y)?29:28):30}function dt(v){const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d)}function day(v){return Math.min(v,30)}function calcOne(a,b){const sy=a.getFullYear(),sm=a.getMonth()+1,sd=day(a.getDate()),ey=b.getFullYear(),em=b.getMonth()+1,ed=day(b.getDate());if(b<a)return {m:0,d:0};if(sy===ey&&sm===em){let t=Math.max(0,ed-sd+1);return {m:Math.floor(t/30),d:t%30}}let m=0,d=0;if(sd===1)m++;else d+=len(sy,sm)-sd+1;let y=sy,mo=sm;while(true){mo++;if(mo===13){mo=1;y++}if(y===ey&&mo===em)break;m++}if(ed>=len(ey,em))m++;else d+=ed;m+=Math.floor(d/30);d%=30;return {m,d}}function render(){const b=document.getElementById('tripList');b.innerHTML='';trips.forEach((t,i)=>{const r=document.createElement('div');r.className='trip';r.innerHTML='<span>'+t.a+' → '+t.b+'</span><button data-i="'+i+'">Αφαίρεση</button>';b.appendChild(r)});b.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{trips.splice(Number(x.dataset.i),1);render()})}document.getElementById('addTrip').onclick=()=>{const a=document.getElementById('embark').value,b=document.getElementById('discharge').value;if(!a||!b){alert('Συμπληρώστε ναυτολόγηση και απόλυση.');return}if(dt(b)<dt(a)){alert('Η απόλυση δεν μπορεί να προηγείται της ναυτολόγησης.');return}trips.push({a,b});render()};document.getElementById('calculate').onclick=()=>{let m=0,d=0;trips.forEach(t=>{const x=calcOne(dt(t.a),dt(t.b));m+=x.m;d+=x.d});m+=Math.floor(d/30);d%=30;if(k==='2'){const pm=Number(document.getElementById('prevM').value||0),pd=Math.max(0,Math.min(29,Number(document.getElementById('prevD').value||0)));m+=pm+Math.floor((d+pd)/30);d=(d+pd)%30;document.getElementById('previous').classList.remove('hidden');document.getElementById('previousText').textContent='Για ΚΕΠ 2 λαμβάνεται υπόψη και η προηγούμενη υπηρεσία ΚΕΠ 1.'}const total=m*30+d;document.getElementById('result').textContent='Συγκεντρωμένη υπηρεσία: '+m+' μήνες και '+d+' ημέρες.'+(total>=180?' Το ΚΕΠ μπορεί να εξεταστεί.':' Εκκρεμεί η απαιτούμενη υπηρεσία των έξι μηνών και δεν μπορεί να εξεταστεί.');document.getElementById('result').className='result '+(total>=180?'':'pending');document.getElementById('exam').classList.toggle('visible',total>=180)};function update(){const done=document.getElementById('completed').checked,g=Number(document.getElementById('grade').value),docs=document.querySelector('input[name="docs"]:checked')?.value||'';document.getElementById('gradeWrap').classList.toggle('visible',done);if(!done)return;if(!Number.isFinite(g)||g<0||g>10){document.getElementById('classification').textContent='';document.getElementById('decision').textContent='ΤΕΛΙΚΗ ΑΠΟΦΑΣΗ: Σε εκκρεμότητα — απαιτείται βαθμός 0–10';return}const c=g<5?'Ανεπιτυχής':g<6.5?'Καλώς — Επιτυχής':g<8.5?'Λίαν Καλώς — Επιτυχής':'Άριστα — Επιτυχής';document.getElementById('classification').textContent='Κατάταξη: '+c;document.getElementById('decision').textContent=g<5?'ΤΕΛΙΚΗ ΑΠΟΦΑΣΗ: ΑΠΟΡΡΙΠΤΕΑ':docs==='full'?'ΤΕΛΙΚΗ ΑΠΟΦΑΣΗ: ΕΠΙΤΥΧΗΣ':docs==='incomplete'?'ΤΕΛΙΚΗ ΑΠΟΦΑΣΗ: ΕΠΙΤΥΧΗΣ — Εκκρεμότητα δικαιολογητικών':'ΤΕΛΙΚΗ ΑΠΟΦΑΣΗ: ΕΠΙΤΥΧΗΣ — Εκκρεμεί ο έλεγχος δικαιολογητικών'}document.getElementById('completed').onchange=update;document.getElementById('grade').oninput=update;document.querySelectorAll('input[name="docs"]').forEach(x=>x.onchange=update);document.getElementById('back').onclick=()=>history.back();document.getElementById('save').onclick=()=>{sessionStorage.setItem('seaServiceCandidate',JSON.stringify({registry:document.getElementById('registry').value,fullName:document.getElementById('fullName').value,signed:document.getElementById('signed').textContent}));location.href='rebuild-test-login.html?v=9'} })();
</script></body></html>
